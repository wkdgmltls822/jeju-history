 독립운동에 앞장서기도 하였습니다.","address":"제주특별자치도 제주시 건입동 1275-10","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4023"},{"id":4101,"name":"인성리 방사탑","lat":33.241599,"lng":126.282581,"category":"확장분야","dir1":"역사","dir2":"근대","title":"널개오름을 등진 섬마을","subtitle":"","author":"한국향토사연구전국협의회","keywords":"촌락.실태조사.우리문화.산업화.도시화","content":"주로 300~500년 전 에 이루어진 `제주의 마을`들에는 마을마다 특이한 형성과정이 있다. 귀양으로 혹은 정치적 망명으로 목숨을 걸고 거친 바다를 건너와서 부평초처럼 정착했던 태초의 마을 사람들.우리의 이 작업은 이들에 대한 애뜻한 한가닥 애정에서 비롯된 것 이다. 정착후 이들은 숱한 전설과 일화를 남겼다. 거친한숨. 고뇌의 숨결은 그대로 민요가 되었다. 지어지는데로 붙인 밭이름. 바다 이름. 언덕 이름들이 그마을의 역사와 삶의 자취들을 짐작케 하며 오늘날까지도 밭이랑의 돌멩이만큼이나 널려 있다.","address":"제주특별자치도 서귀포시 대정읍 인성리 29-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4101"},{"id":4390,"name":"구엄리 돌염전","lat":33.483407,"lng":126.376488,"category":"확장분야","dir1":"사회","dir2":"사회","title":"구엄리돌염전","subtitle":"","author":"제주특별자치도","keywords":"구엄리.돌염전.염전","content":"커다란 암반 위에 마치 거북이 등처럼 흙으로 경계선을 만들며 바닷물을 퍼 올려 여러 번의 손을 거쳐 염도를 높였으며 마지막으로 염분을 졸여서 소금을 만들었다. 빌레에서 생산된 소금은 당시 제주에서 귀하기로 소문나 육지 염전의 열 배 가격으로 거래되었으며. 그 맛과 품질이 뛰어나 나라님에게까지 진상할 정도였다. \u003c발췌 : 즐거운 제주 (제주넷)_p.99>","address":"제주특별자치도 제주시 애월읍 구엄리 608-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4390"},{"id":4392,"name":"단산","lat":33.242848,"lng":126.288344,"category":"확장분야","dir1":"자연","dir2":"지구과학","title":"박쥐모양의단산","subtitle":"","author":"제주특별자치도","keywords":"단산.오름.산","content":"박쥐형상을 하고 있는 \u003c단산> 옛날부터 전해 내려오는 구명수의 전설이 있는 곳이다. 아득한 옛날 이 지역에 괴질이 번지고 있었는데 현감의 선몽대로 마침내 석양에 붉게 타오르는 박쥐가 눈앞에 보이는 단산의 형상이 바로 그것이었다고 한다. \u003c발췌 : 즐거운 제주 (제주넷)_p.241>","address":"제주특별자치도 서귀포시 대정읍 인성리 21-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4392"},{"id":4495,"name":"불탑사5층석탑","lat":33.529296,"lng":126.598174,"category":"확장분야","dir1":"관광","dir2":"관광","title":"즐거운 제주(숨어있는 제주의 설화.전설을 따라)","subtitle":"","author":"㈜제주넷","keywords":"설화.전설.제주체험여행","content":"옛날 한라산 기슭에 한 효성이 지극한 사냥꾼이 아픈 어머니와 살고 있었다. 어느날 그는 나그네로부터 어머니 병에 사슴피가 특효라는 말을 듣고 다음날 일찍 일어나 사슴 사냥에 나섰다. 한라산 정상은 짙은 안개로 덮여 앞을 분간하기 어려웠다. 안개 속을 헤매던 그는 마침내 사슴 한 마리를 발견했다. 바로 흰 사슴이었다. 화살을 쏘려던 순간. 어디선가 백발의 노인이 나타나 백록을 막아서더니 사슴을 안고 짙은 안개 속으로 사라졌다. 노인과 백록이 사라진 곳에는 큰 연못만이 있을 뿐이었다. 사냥을 포기한 그는 대신 연못물을 떠가지고 돌아와 어머니께 그 물을 드렸다. 그러자 어머니 병이 하루아침에 말끔히 나았다. 이 이야기를 들은 사람들은 훗날 이 연못을 ‘백록담‘ 이라고 불렀다 한다.","address":"제주특별자치도 제주시 삼양일동 697","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4495"},{"id":4602,"name":"구억리 검은굴","lat":33.281606,"lng":126.285685,"category":"민속","dir1":"민속공예","dir2":"도기공예","title":"검은굴","subtitle":"","author":"제주특별자치도","keywords":"돌가마.검은굴","content":"검은 굴에서는 기물들이 대략 1000도 내에서 소성되었다. 불때기에서 연기가 기물에 들어가 회색으로 나타난다. 그래서 가마 이름을 '검은 굴'이라 한다. \u003c발췌 : 제주의 민속 2권 P538. 1994년> \u003c발췌 : 제주도 전통 사회의 옹기 생산과 유통에 관한 연구 P 72. 2002년>","address":"제주특별자치도 서귀포시 대정읍 구억리 677","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4602"},{"id":4618,"name":"하도리별방진","lat":33.52618,"lng":126.884378,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"별방진 지표조사 보고서","subtitle":"","author":"북제주군","keywords":"별방진.유적지.성곽","content":"북제주군에서는 현대사를 맞이하여 날로 훼손이 심화되어가는 문화재를 보호하고 보존하기 위한 사업의 일환으로 연초에 별방진에 대한 종합적인 정비계획을 수립하여 유적지 지표조사를 위해 지난 6월 (주) 금성종합건축사 사무소와 용역 계약이 이루어졌다. 지표조사는 현장답사가 선행되어 전반적인 보존 상태를 확인하고 날로 훼손이 심화 되어가는 성곽을 주요대상으로 삼았으며 보호구역으로 지정된 성곽을 중점적으로 조사하면서 성내 유적지와 유구 조사를 병행하여 추후 복원보수사업에 기초자료로서 활용될 수 있도록 하는데 주안점을 두고 조사 작업을 진행시켰다. 본보고서에서는 성곽의 보존 상태를 구간별로 설명. 특징과 현장을 설명하였으며 형태의 이해를 돕기 위해 실측도면과 구간별 현황사진을 함께 실었고 각계전문가의 자문을 구하여 별방진에 대한 역사적 의의를 살펴보고 문화재위원의 글을 함께 실어 문화재적 가치와 역사적 의미를 부각시키려는 노력도 소홀히 하지 않았다. 차제에 성지 전반에 걸친 보다 정밀한 지표조사와 발굴조사를 실시하여 성지의 전반적인 규모와 건물지 및 기타 유구 위치 등을 확인하여 복원보수사업이 진행됨이 타당하리라 사료된다.","address":"제주특별자치도 제주시 구좌읍 하도리 3354","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4618"},{"id":4745,"name":"한림읍 명월진성","lat":33.400293,"lng":126.263205,"category":"민속","dir1":"의식주","dir2":"주생활","title":"명월진성 성벽위","subtitle":"","author":"제주특별자치도","keywords":"성.진성.명월진성.방어유적","content":"이 명월진성은 한림읍 명월리와 동명리에 걸쳐 있다. 둘레가 2천 20자. 높이가 8자였으며. 동쪽과 남쪽 및 서쪽에 각각 문이 있었다. 성 안에는 샘이 있어 가뭄에도 마르지 않았으며. 건물로는 객사. 별창. 군기고 등이 있었다. 원래 이곳에는 원래 성이 없었으나 조선 중종 5년(1510)에 장림 목사가 이곳은 비양도로 왜선이 가까이 대일 수 있는 곳이라 하여 목성을 쌓았었는데. 선조 25년 (1592)에 이경록 목사가 석성으로 개축하였으며. 영조 40년(1764)에는 이수봉 어사가 조정에 아뢰어 조방장을 만호로 승격시켰다. \u003c발췌 : 북제주군 문화유적분포지도 P219. 2002년>","address":"제주특별자치도 제주시 한림읍 동명리 2256","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=4745"}];
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
DATA.forEach((d) => { d.city = (d.address.split(" ")[1] || ""); });
$("total").textContent = DATA.length;

// 필터 선택지 채우기
const fill = (el, key) => [...new Set(DATA.map((d) => d[key]))].sort().forEach((v) => el.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
fill($("cat"), "category"); fill($("dir"), "dir1");

// 찜 = 내 답사 코스 (찜한 순서가 곧 방문 순서, 브라우저에 저장)
let favs = [];
try { favs = JSON.parse(localStorage.getItem("jeju-course") || "[]").filter((id) => DATA.some((d) => d.id === id)); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("jeju-course", JSON.stringify(favs)); } catch (e) {} };
const byId = (id) => DATA.find((x) => x.id === id);
const isFav = (id) => favs.includes(id);
const km = (a, b) => {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};

// 지도 핀 / 팝업
const pinIcon = (d, on) => {
  const i = favs.indexOf(d.id);
  return L.divIcon({ className: "pinwrap", iconSize: [26, 26], iconAnchor: [4, 26], popupAnchor: [9, -26],
    html: `<div class="pin${on ? " on" : ""}${i >= 0 ? " fav" : ""}" style="background:${d.category === "민속" ? "#0f8b8d" : "#2c6fbb"}">${i >= 0 ? `<span class="pn">${i + 1}</span>` : ""}</div>` });
};
const favBtn = (d) => `<button class="favbtn${isFav(d.id) ? " on" : ""}" data-fav="${d.id}">${isFav(d.id) ? "♥ 코스에서 빼기" : "♡ 코스에 담기"}</button>`;
const popupHtml = (d) => `<div class="pop"><h3>${esc(d.name)}</h3><span class="tag">${esc(d.category)}</span><span class="tag b">${esc(d.dir1)}</span>
  <p><b>${esc(d.title)}</b></p><p>📍 ${esc(d.address.replace("제주특별자치도 ", ""))}</p>
  <p>${esc(d.content.length > 260 ? d.content.slice(0, 260) + "…" : d.content)}</p>
  <a href="${esc(d.url)}" target="_blank" rel="noopener">원문 보기 ↗</a><br>${favBtn(d)}</div>`;

// 지도
let map = null, markers = {}, courseLine = null;
if (window.L) {
  map = L.map("map").setView([33.38, 126.55], 10);
  const esri = (n) => "https://server.arcgisonline.com/ArcGIS/rest/services/" + n + "/MapServer/tile/{z}/{y}/{x}";
  // 일반 지도는 Esri 가 한국 지역을 줌 13 까지만 제공 → 그 이상은 확대만 하고, 자세히 볼 땐 위성 사진으로 전환
  const street = L.tileLayer(esri("World_Street_Map"), { maxNativeZoom: 13, maxZoom: 18, attribution: "Tiles © Esri" }).addTo(map);
  const sat = L.tileLayer(esri("World_Imagery"), { maxZoom: 18, attribution: "Tiles © Esri" });
  L.control.layers({ "지도": street, "위성(자세히)": sat }, null, { position: "topright" }).addTo(map);
  DATA.forEach((d) => {
    const m = L.marker([d.lat, d.lng], { icon: pinIcon(d, false), title: d.name });
    m.bindPopup(() => popupHtml(d), { maxWidth: 300 });
    m.on("click", () => select(d.id, false));
    markers[d.id] = m;
  });
} else {
  $("map").innerHTML = '<div class="nomap">지도를 불러오지 못했습니다. (인터넷 연결이 필요해요) 목록과 상세 조회는 그대로 사용할 수 있습니다.</div>';
}

let selected = null, shown = [];
const updateIcons = () => { if (map) DATA.forEach((x) => markers[x.id].setIcon(pinIcon(x, x.id === selected))); };

function renderList() {
  $("list").innerHTML = shown.length ? shown.map((d) =>
    `<div class="item${d.id === selected ? " sel" : ""}" data-id="${d.id}">
       <button class="heart${isFav(d.id) ? " on" : ""}" data-fav="${d.id}" title="${isFav(d.id) ? "코스에서 빼기" : "코스에 담기"}">${isFav(d.id) ? "♥" : "♡"}</button>
       <div class="nm">${isFav(d.id) ? `<span class="tag" style="background:#fde6ee;color:#e0457b">코스 ${favs.indexOf(d.id) + 1}번</span> ` : ""}${esc(d.name)}</div>
       <div class="ti">${esc(d.title)}</div>
       <div><span class="tag">${esc(d.category)}</span><span class="tag b">${esc(d.dir1)}</span></div>
       <div class="ad">${esc(d.address.replace("제주특별자치도 ", ""))}</div>
     </div>`).join("") : '<div class="empty">조건에 맞는 장소가 없습니다.</div>';
}

function apply() {
  const q = $("q").value.trim().toLowerCase(), c = $("cat").value, r = $("dir").value, ci = $("city").value, of = $("onlyfav").checked;
  shown = DATA.filter((d) =>
    (!c || d.category === c) && (!r || d.dir1 === r) && (!ci || d.city === ci) && (!of || isFav(d.id)) &&
    (!q || [d.name, d.title, d.subtitle, d.keywords, d.address, d.content].join(" ").toLowerCase().includes(q)));
  $("cnt").textContent = shown.length;
  if (map) map.closePopup();
  renderList();
  if (map) {
    const ids = new Set(shown.map((d) => d.id));
    DATA.forEach((d) => { const m = markers[d.id]; ids.has(d.id) ? m.addTo(map) : m.remove(); });
    if (shown.length && !selected) map.fitBounds(shown.map((d) => [d.lat, d.lng]), { padding: [30, 30], maxZoom: 13 });
  }
}

function renderDetail(id) {
  const d = byId(id);
  $("detail").innerHTML =
    `<h2>${esc(d.name)}</h2>
     <div class="meta"><span class="tag">${esc(d.category)}</span><span class="tag b">${esc(d.dir1)}${d.dir2 !== "해당없음" ? " › " + esc(d.dir2) : ""}</span><br>
       📍 ${esc(d.address)}<br>🧭 위도 ${d.lat} · 경도 ${d.lng}${d.keywords ? "<br>🏷 " + esc(d.keywords.replace(/\./g, ", ")) : ""}</div>
     ${favBtn(d)}
     <p><b>${esc(d.title)}</b></p>${d.subtitle ? `<div class="meta">${esc(d.subtitle)}</div>` : ""}
     <p>${esc(d.content)}</p>
     <div class="meta">저작자: ${esc(d.author)} · <a href="${esc(d.url)}" target="_blank" rel="noopener">제주도 누리집에서 전체 보기 ↗</a></div>`;
}

function select(id, fly = true) {
  selected = id;
  const d = byId(id);
  document.querySelectorAll(".item").forEach((el) => {
    const on = Number(el.dataset.id) === id;
    el.classList.toggle("sel", on);
    if (on) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  if (map) {
    if (!map.hasLayer(markers[id])) markers[id].addTo(map);
    updateIcons();
    if (fly) { map.flyTo([d.lat, d.lng], 13, { duration: .8 }); map.once("moveend", () => markers[id].openPopup()); }
    else markers[id].openPopup();
  }
  renderDetail(id);
  showTab("detail");
  $("detail").scrollTop = 0;
}

// ---- 답사 코스 ----
function drawCourse() {
  if (!map) return;
  if (courseLine) { courseLine.remove(); courseLine = null; }
  const pts = favs.map((id) => [byId(id).lat, byId(id).lng]);
  if (pts.length >= 2) courseLine = L.polyline(pts, { color: "#e0457b", weight: 4, opacity: .85, dashArray: "9 8" }).addTo(map);
}
function renderCourse() {
  $("favn").textContent = favs.length;
  if (!favs.length) { $("course").innerHTML = '<div class="empty">카드의 ♡ 버튼(또는 핀 팝업의 「코스에 담기」)으로 장소를 담으면<br>담은 순서대로 선이 이어져 나만의 답사 코스가 만들어져요.</div>'; return; }
  let total = 0;
  const steps = favs.map((id, i) => {
    const d = byId(id), leg = i ? km(byId(favs[i - 1]), d) : 0; total += leg;
    return `<div class="cstep"><span class="no">${i + 1}</span>
      <span class="nm" data-act="go" data-id="${id}">${esc(d.name)}<br><span class="dist">${i ? "이전 장소에서 직선 " + leg.toFixed(1) + "km" : "출발지"}</span></span>
      <button data-act="up" data-id="${id}" ${i === 0 ? "disabled" : ""}>▲</button>
      <button data-act="down" data-id="${id}" ${i === favs.length - 1 ? "disabled" : ""}>▼</button>
      <button data-act="rm" data-id="${id}">✕</button></div>`;
  }).join("");
  $("course").innerHTML =
    `<div class="sum">총 <b>${favs.length}</b>곳 · 직선거리 합계 약 <b>${total.toFixed(1)}km</b></div>
     <button class="cbtn" data-act="fit">🗺 코스 전체 보기</button><button class="cbtn" data-act="clear">🗑 코스 비우기</button>${steps}`;
}
function refreshFav() {
  saveFavs();
  if ($("onlyfav").checked) apply(); else renderList();
  updateIcons(); drawCourse(); renderCourse();
  if (selected) {
    renderDetail(selected);
    const m = markers[selected];
    if (m && m.isPopupOpen()) m.setPopupContent(popupHtml(byId(selected)));
  }
}
function toggleFav(id) { isFav(id) ? favs.splice(favs.indexOf(id), 1) : favs.push(id); refreshFav(); }
function showTab(t) {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("detail").hidden = t !== "detail"; $("course").hidden = t !== "course";
}

document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-fav]");
  if (f) { toggleFav(Number(f.dataset.fav)); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const id = Number(a.dataset.id), i = favs.indexOf(id);
  if (a.dataset.act === "go") select(id);
  else if (a.dataset.act === "rm") toggleFav(id);
  else if (a.dataset.act === "up" && i > 0) { [favs[i - 1], favs[i]] = [favs[i], favs[i - 1]]; refreshFav(); }
  else if (a.dataset.act === "down" && i < favs.length - 1) { [favs[i + 1], favs[i]] = [favs[i], favs[i + 1]]; refreshFav(); }
  else if (a.dataset.act === "clear") { if (confirm("답사 코스를 모두 비울까요?")) { favs = []; refreshFav(); } }
  else if (a.dataset.act === "fit" && map) {
    favs.forEach((x) => { if (!map.hasLayer(markers[x])) markers[x].addTo(map); });
    map.fitBounds(favs.map((x) => [byId(x).lat, byId(x).lng]), { padding: [40, 40], maxZoom: 13 });
  }
});
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });
$("list").addEventListener("click", (e) => { if (e.target.closest(".heart")) return; const it = e.target.closest(".item"); if (it) select(Number(it.dataset.id)); });
["q", "cat", "dir", "city", "onlyfav"].forEach((id) => $(id).addEventListener("input", () => { selected = null; updateIcons(); apply(); }));
$("reset").onclick = () => { ["q", "cat", "dir", "city"].forEach((id) => ($(id).value = "")); $("onlyfav").checked = false; selected = null; updateIcons(); apply(); };
apply(); updateIcons(); drawCourse(); renderCourse();
</script>
</body>
</html>
