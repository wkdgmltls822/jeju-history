<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>제주 역사문화 조회</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2430; --sub:#6b7686; --line:#e1e6ec; --main:#0f8b8d; --main-bg:#e3f4f4; --hl:#fff4c2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI","Malgun Gothic",system-ui,sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { background: linear-gradient(90deg,#0f8b8d,#2c6fbb); color: #fff; padding: 12px 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header small { opacity: .85; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--line); align-items: center; }
  .filters input, .filters select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; background: #fff; }
  .filters input { flex: 1 1 220px; min-width: 160px; }
  .filters button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font: inherit; font-size: 14px; }
  .count { margin-left: auto; color: var(--sub); font-size: 14px; }
  .count b { color: var(--main); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px 1fr; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--card); }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f6fafa; }
  .item.sel { background: var(--hl); box-shadow: inset 4px 0 0 #f0b400; }
  .item .nm { font-weight: 700; }
  .item .ti { font-size: 13px; color: #3b4556; margin: 2px 0; }
  .item .ad { font-size: 12px; color: var(--sub); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--main-bg); color: var(--main); margin-right: 4px; }
  .tag.b { background: #e8eefc; color: #2c5cc5; }
  .right { display: flex; flex-direction: column; min-height: 0; }
  #map { flex: 1; min-height: 240px; }
  .item { position: relative; padding-right: 48px; }
  .heart { position: absolute; top: 8px; right: 10px; border: 1px solid var(--line); background: #fff; border-radius: 999px; width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer; color: #aab2bf; }
  .heart:hover { border-color: #e0457b; color: #e0457b; }
  .heart.on { background: #e0457b; border-color: #e0457b; color: #fff; }
  .favbtn { border: 1px solid #e0457b; background: #fff; color: #e0457b; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; margin-top: 4px; }
  .favbtn.on { background: #e0457b; color: #fff; }
  .filters label { font-size: 14px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .pin.fav { background: #e0457b !important; }
  .pin.fav::after { display: none; }
  .pin .pn { position: absolute; inset: 0; transform: rotate(45deg); color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .bottom { max-height: 44%; display: flex; flex-direction: column; background: var(--card); border-top: 1px solid var(--line); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: #f7f9fb; padding: 8px; font: inherit; font-size: 14px; cursor: pointer; color: var(--sub); }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 #e0457b; }
  #course { overflow-y: auto; padding: 12px 18px; }
  #course .sum { font-size: 14px; margin-bottom: 8px; } #course .sum b { color: #e0457b; }
  .cstep { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .cstep .no { background: #e0457b; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .cstep .nm { flex: 1; cursor: pointer; } .cstep .dist { color: var(--sub); font-size: 12px; }
  .cstep button, .cbtn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .cbtn { padding: 6px 12px; margin: 0 6px 8px 0; }
  #detail { flex: 1; overflow-y: auto; padding: 14px 18px; }
  #detail h2 { margin: 0 0 4px; font-size: 18px; }
  #detail .meta { font-size: 13px; color: var(--sub); margin-bottom: 8px; line-height: 1.7; }
  #detail p { line-height: 1.7; font-size: 14px; margin: 8px 0; white-space: pre-wrap; }
  #detail a { color: #2c5cc5; }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.4); position: relative; }
  .pin::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; top: 7px; left: 7px; }
  .pin.on { box-shadow: 0 0 0 3px #f0b400, 0 2px 6px rgba(0,0,0,.5); }
  .leaflet-div-icon.pinwrap, .pinwrap { background: none; border: 0; }
  .pop { max-width: 280px; max-height: 240px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop p { margin: 6px 0; }
  .empty { padding: 30px; color: var(--sub); text-align: center; }
  .nomap { padding: 30px; text-align: center; color: var(--sub); }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; }
    #list { order: 2; border-right: 0; } .right { order: 1; }
    .bottom { max-height: 50%; }
  }
</style>
</head>

const DATA = [{"id":367,"name":"세심재","lat":33.501626,"lng":126.514125,"category":"민속","dir1":"의식주","dir2":"식생활","title":"제주의 전통음식문화를 찾아서","subtitle":"","author":"제주대학교 탐라문화연구소","keywords":"제주.전통음식.음식문화.제주의 술.관광상품화","content":"제주도는 농사짓는 땅이 적어 가정의 식량은 겨우 대는 정도이고 . 밭곡식은 조. 피. 보리. 메밀. 콩. 팥. 녹두. 깨 등 잡곡이 주가 되고. 감자·고구마의 생산이 많다. 채소와 된장 해조류가 찬의 재료가 되고 바닷고기도 말려서 두고 쓰고 수육은 주로 돼지고기이고 닭을 쓰는 음식 대부분이다.(중략)쌀이 귀하므로 평소에는 보리. 조. 팥등의 잡곡밥을 많이 짓고 제삿날이나 비념에 고은밥(쌀밥)을 지어 먹는데. 쌀의 80%를 육지에서 들어와야 하는 형편에 있었다. 물론 근 30년간 외지사람의 이주로 양상이 달라지고 있다. 옛날의 식사는 잡곡밥에 된장을 푼 배추국. 콩잎국. 무국. 파국. 호박국. 미역국. 생선국을 반드시 끓이고 반찬은 자리젓. 갈치자반. 정갱이자반. 고등어자반. 건어를 쓰고 회는 생것이 손에 들어오면 먹게 되고 자리회를 먹는 것이 큰 즐거움이라 하였다.(중략) 또 점심에 먼 곳에 나가서 일하는 사람은 대로 엮은 도시락이 있어 잡곡밥을 담고 찬은 된장과 자리젓을 옆에 담고 밭에서 연한 콩잎을 따서 쌈을 싸면 일품이라고 한다. 부지런하고 소박한 성품이 음식에서도 소박하고 꾸밈이 없고 질박한 식생활이었으나 건강하고 일을 잘하기로 칭송을 받는 주민들이었다. 곡식음식은 바다 것을 넣은 죽이 사치스럽게도 맛이 있고. 메밀로 만든 만두나 수제비를 잘 만들고 미역죽. 닭죽도 잘 만든다.","address":"제주특별자치도 제주시 용담일동 2822-18","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=367"},{"id":427,"name":"고봉례묘","lat":33.506644,"lng":126.563633,"category":"민속","dir1":"통과의례","dir2":"장례","title":"탐라성주 고봉례묘 추정지","subtitle":"화북동 분묘유적 발굴조사 보고서(제주대학교박물관 조사보고 제17집)","author":"제주시","keywords":"고봉례.성주.분묘.유적.출토유물","content":"영산 한라의 맥이 흘러든 자락에 자리한 우리들의 삶터 제주시는 오늘날 제주도의 행정 중심지일 뿐만 아니라. 탐라국 시대에도 으뜸 도시였습니다. 그러나 아쉽게도 탐라국의 실체를 뚜렷하게 찾아내지 못하고 있음은 실로 안타까운 일입니다. 그만큼 '탐라사'는 굴곡이 깊었다는 반증이기도 합니다. 지금 우리가 살고 있는 지방화 시대는 우리들의 일을 우리들 스스로 해야 하는 시대입니다. 이는 우리들 역사에서도 마찬가지입니다. 탐라사는 곧 하나의 '지방사'라는 수동적인 '사관'에서 벗어나. 주체적으로 '탐라사'를 세워나가야 함은 우리들 앞에 놓인 엄숙한 과제이기도 합니다. 주체적으로 '탐라사'를 세우는 일은 여러 가지가 있겠습니다만. 탐라국사의 상징적 존재인 '성주'의 실체를 우선 실증적으로 찾아내야 할 것입니다. 성주의 실체가 상실된 것은 1404년(조선 태종 4) 성주 . 왕자직이 없어지면서부터이며. 이와 동시에 탐라국도 소멸되었습니다. 따라서 주체적인 탐라사 정립을 위해서는 우선 구전으로 전해 내려오던 거로 마을의 '능동산'에 있는 탐라 마지막 성주인 고봉례의 묘를 발굴. 조사하는 일입니다. 이는 다름 아닌 '탐라사'의 기둥을 세우는 일이기 때문입니다. 우리 시에서는 제주대학교 박물관에 발굴 조사를 의뢰하여. 그 결과 분묘의 성격. 축조 방법. 축조 시기. 출토 유물 등을 들춰내 「탐라성주 고봉례묘추정지」라는 이름으로 학계에 내놓을 수가 있었…","address":"제주특별자치도 제주시 화북 2동 4301번지","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=427"},{"id":428,"name":"용담동 고분유적","lat":33.501738,"lng":126.509924,"category":"민속","dir1":"통과의례","dir2":"장례","title":"용담동 옹관묘 발굴보고","subtitle":"","author":"제주시/제주대학교박물관","keywords":"용담동.옹관묘.발굴조사.유물.유구","content":"금번 보고서로 내는 제주시 용담동 고분 유적은 기원 전후한 제주 역사 여명기를 밝혀주는 중요한 유적입니다. 이 유적의 조사를 통해서 고대 탐라국의 형성기에 어떠한 문화적 변동이 있었는가에 대해서 완전히 새로운 사실들을 알 수가 있었습니다. 비록 장기적인 조사 계획에 바탕을 두고. 충분한 여건이 주어진 가운데 발굴조사가 이루 어진 것은 아닙니다만. 자칫 세상에 알려지지 않은 채. 영원히 파괴되었을지도 모를 이 중요한 유적이 지역주민의 투철한 문화재 의식으로 그나마 조사된 것은 정말 다행한 일입니다. 아무쪼록 이 유적과 같은 긴급구제발굴조사가. 근래에 들어 개발을 급하게 서두르고 있는 제주도에서 하나의 시금석이 되기를 바랍니다. 그리고. 이번의 발굴조사 보고서가 제주도 탐라 상고사의 연구뿐만 아니라. 한국 전체 상고사 연구에 잘 활용이 되기를 바랍니다.","address":"제주특별자치도 제주시 용담이동 2696-2외 20필지","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=428"},{"id":433,"name":"하원리 분묘군","lat":33.277524,"lng":126.470685,"category":"민속","dir1":"통과의례","dir2":"장례","title":"제주 하원동 분묘군","subtitle":"","author":"고창석/강창화/김동전","keywords":"하원동.분묘.왕자묘.출토유물","content":"　하원동 분묘군은 일찍부터 '왕자묘(王子基)' 라는 이름으로 세간에 알려져 있었다. 이 묘는 1914년(대정3)에 일본인들에 의해 묘가 도굴된 바 있어 더더욱 주목되어왔다. 이 묘는 탐라국의 왕자(王子)와 관련된 왕자묘라는 주장과 원나라 백백태자(伯伯太子)의 묘일 가능성이 있다는 두 설이 있다. 이원조 제주목사(1842~45)가 지은 『탐라지초본』 대정현 '고적' 에 따르면 \"왕자묘는 대정현 동쪽 45리에 있다. 궁산 옆 두 하천 사이에 3기묘의 계천이 아직도 남아있다. 두 모퉁이에는 백작약들이 자라고 있다. 가래촌에는 또한 궁궐 유적으로 보이는 초석들이 남아 있는데 이곳이 탐라의 도읍처가 아닌가 의심된다. 전해 오는 바에 의하면 산방을 이도라고도 하였다.(王子墓在縣東四十五里弓山兩川之間 三墓階喘尙在兩隅有白灼藥 加來村裏 又有宮闕遺礎 疑是旱羅都處 俗傅山房爲第二徒云)\" 이 묘가 두 하천 사이에 자리하고 있고. 3기묘의 묘역이 남아있다는 기록은 현재에 현황과 일치한다. 본 조사는 이러한 여러 가지 설을 입증하고 일제시대 도굴된 묘의 성격을 재 규명하기 위해 조사에 착수하였다. 조사 목적은 문헌과 구전을 통해 알려진 동 묘제를 발굴하여 탐라말기 지배층 묘제양식과 그 성격을 규명하고. 나아가 밝혀 질 이들 묘제의 양식과 성격 파악을 통해 탐라국 말기의 사회상을 복원하여 인문·관광자원으로 활용하고자 하는데 있었다.","address":"제주특별자치도 서귀포시 하원동 21","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=433"},{"id":447,"name":"예래동 고인돌군","lat":33.254677,"lng":126.390212,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"예래동 고인돌군 · 영천관지 · 법정사지","subtitle":"서귀포시 비지정 문화재 지정 · 보호를 위한 학술조사","author":"서귀포시/제주문화예술재단 문화재연구소","keywords":"상예동.고인돌.영천관지.법정사지.지석묘군.예래동.영천관지","content":"이 조사의 목적은 서귀포시 비지정 향토 유형 문화유산 중 제주도 지정문화재로 지정할 만한 가치가 있는 예래동 고인돌군. 영천관지. 법정사지에 대한 정밀조사를 실시하여 문화재 지정에 필요한 근거자료와 역사성을 파악하는데 있다. 유물산포지를 통해서 확인될 수 있는 것은 사람이 살던 생활터의 입지적 조건이다. 그리고 각 유물산포지 단위의 범위와 밀집도가 거주 양식과 기간과도 관계가 되겠지만. 인구 규모와도 정비례의 상관관계가 있다고도 생각이 되므로. 개략적으로 마을의 크고 작음을 구분하여 그 분포를 살필 수가 있다. 탐라시대 전기에는 앞선 단계보다 훨씬 많은 유물 산포지 유적이 확인된다. 무문토기 시기에는 불과 10개 지점 미만이 확인되었는데 비해 이 시기에 오면 수십여 개 지점에 이른다. 그리고 곽지리나 광령리 등 단위 유적 하나가 직경이 수백 미터 이상 되는 규모의 것도 있다. 따라서 많은 인력이 동원되어야 하는 고인돌 유적을 구태여 들지 않더라도 이 시기에 이러한 정도의 유적 상황만으로도 제주도 곳곳에 모양을 갖춘 마을이 들어섰음이 어렵지 않게 추정될 수 있다.","address":"제주특별자치도 서귀포시 상예동 1514","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=447"},{"id":452,"name":"식산봉","lat":33.465678,"lng":126.919965,"category":"민속","dir1":"기타","dir2":"해당없음","title":"식산봉 생태학술조사 보고서","subtitle":"","author":"남제주군/제주대학교","keywords":"식산봉.기후.토양.식물상.식생.황근","content":"제주도 기념물 제47호 식산보의 황근자생지 및 상록활엽수림으로 지정되어 보호되고 있는 식산봉 일원에 대하여 유관속식물상. 현존식생과 군락구조 및 현존식생의 분포 등을 조사하고. 자연환경보전법에 의하여 보호되고 있는 황근의 분포 및 생육상황을 조사하여 건전한 식생의 유지를 위한 장기적인 관리방안을 수립하는데 본 조사의 목적이 있다. 식물상의 조사는 조사지를 답사하면서 출현하는 유관속식물을 동정하여 식물상 목록을 이(1989)에 의하여 작성하였다. 식생조사는 식물사회학적인 방법(Braun-Blanquet. 1964)에 의하였으며. 조사지의 입지는 해발고. 미지형. 사면방위. 경사도 등을 기록하였다. 조사지내의 전 출현종에 대하여 계층별로 기록하고. 각 층에 출현하는 종의 우점도와 군도를 기록하였다.","address":"제주특별자치도 서귀포시 성산읍 오조리 318-4","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=452"},{"id":489,"name":"법환 잠녀 문화마을","lat":33.235212,"lng":126.514523,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"법환동 「문화 · 역사마을 가꾸기」 마을 현황 조사 및 기본계획","subtitle":"","author":"문화 · 역사마을 가꾸기 서귀포시 추진위원회","keywords":"법환동.문화마을.역사마을.잠녀.해녀","content":"· 법환 잠녀 문화마을은 1.500년 전부터 사람이 살기 시작한 마을로서 이 마을앞에 자리잡고 있는 범섬은 고려시대 최영장군이 목호들을 토벌하던 전적지임 · 문화유적으로는 신앙유적인 신당. 생활유적인 물 · 멜통 · 바다밭 · 김치통 · 카름물 등을 가지고 있으며. 제주도의 가장 오래된 생활문화의 하나라고 할 수 있는 해녀작업이 오늘날까지도 왕성하게 행해지는 지역임 · 법환 잠녀 문화마울이 가지는 자원들의 장단점 분석을 통해 쾌적한 자연 및 생태공간·전통문화 등 어촌의 강점을 최대한 살린 법환 잠녀 문화마을 발전계획을 수립하여 도시민에게는 건전한 여가선용공간과 주민들에게는 소득증대와 삶의 질 향상. 전통과 문화가 보존되어 후세에게 귀중한 유산을 물려줄 수 있는 마을을 조성함","address":"제주특별자치도 서귀포시 법환동 208-4 법환어촌체험마을","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=489"},{"id":491,"name":"종달리패총","lat":33.494381,"lng":126.893463,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"제주종달리패총","subtitle":"제주대학교박물관조사보고 제21집 종달리패총 1지구 발굴조사보고서","author":"북제주군/제주대학교박물관","keywords":"종달리.패총.층위.피트.유물.동물뼈","content":"이 보고서는 제주 종달리패총 제1지구 발굴조사 결과를 요약 · 정리한 것이다. 행정구역상의 조사지 위치는 북제주군 구좌읍 종달리 1707번지이다. 1991년 9월. 북제주군은 종달리 지미봉 해안을 돌아가는 해안 일주도로를 건설하면서 패총부분을 파괴하게 되었다. 따라서 이 조사는 이미 뒤집어 진 패각층과 남아있는 패총을 조사하는 긴급한 수습발굴조사 차원에서 진행되었다. 비록 패총이 파괴되었다 하더라도 그동안 제주 동북부지역에서 선사유적이 확인된 바 없었던 터라. 그나마 다행스러운 일이었다. 우선 지표조사를 통해 유물 산포지를 중심으로 3개소의 패총구역을 확인할 수 있었다. 특히. 패총과 유물산포지에서 제주도에서는 그동안 출토가 거의 되지 않았던 점토대토기가 분포하고 있음을 확인할 수 있었다. 확인된 유적의 범위는 동서 700m. 남북 250m로. 지미봉을 축으로 길게 장타원형을 이루었다. 그후 이 유적에서 10km남짓 떨어진 김녕리 '궤내기' 동굴입구집자리에서 단면 원형 · 삼각형 점토대토기가 출토되었고. 유적 바로 인근에 자리한 종달1리 포구에서 말기형태의 주형동검이 수습되었다. 이러한 흐름은 공렬토기가 출토되는 다른 제주 지역과 구별되는. 제주 동북부지역의 선사문화의 성격을 규명하는데 좋은 자료를 제공해 주었다. 현장조사는 다음과 같이 팀을 구성하여 발굴을 하였다. 조사단장에는 당시 제주대학교박물관장이었던 강통원 교수. 조사책임자에…","address":"제주특별자치도 제주시 구좌읍 종달리 1838-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=491"},{"id":519,"name":"하논","lat":33.252969,"lng":126.545738,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"우리고장 바로알기","subtitle":"","author":"서귀포문화원","keywords":"범섬.천지연.수모루.왕자묘.칠십리","content":"서귀포 바다의 아름다움은 범섬에서 부터 시작된다. 범섬이 숲섬. 새섬. 문섬 다음으로 크면서도 가장 크고 웅대하게 느껴지는 이유는. 모습 그대로 범이 포효하는 듯 한 섬의 웅장함에 있기 때문일 것이다. 이는 지금 우리만의 느끼는 감정이 아니다. 여느 고지도에 보더라도 서귀포 바다의 다른 섬에 비해 범섬이 크게 표기된 것으로 보아. 옛 선인들께서도 같은 감흥으로 섬을 지켜본 듯하다. 전설 속에 범섬의 탄생은. 오랜 옛날 사냥꾼이 실수로부터 시작된다. 사냥 나갔던 사냥꾼이 잘못하여 옥황상제의 배를 건드리니. 상제가 크게 노하여 한라산 봉우리를 뽑아 던진 것이 제주의 섬들이 생겨나게 된 원인이 되었다고 전한다. 또한 제주섬의 수호신 설문대 할망 전설이 이 섬에도 남아 있다. 설문대 할망이 얼마나 크셨는지 잠을 잘 때는 백록담을 베개로 삼아 누우면 고근산이 허리가 되었고. 할머니가 뻗은 발은 범섬에 닿았다고 한다. 아울러 범섬은 그 모습이 호랑이처럼 생겼다 하여 범섬이라 불렸다 하며. 지난날 이곳에 사람이 살 때에도 범의 형세이기 때문에 고양이는 기르지 못했었다고 전한다. 범섬은 서귀포시 법환동 산 1.2.3번지로서 지목 임야. 대지. 면적 84298 평방미터이며. 사유지이다.","address":"제주특별자치도 서귀포시 서홍동 1003","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=519"},{"id":521,"name":"가시오름","lat":33.24703,"lng":126.24332,"category":"민속","dir1":"신화/전설","dir2":"제주신화.전설","title":"제주도전설지","subtitle":"","author":"제주도","keywords":"전설.설화.민담","content":"정기어린 한라산이 사면의 바다와 조화를 이루어. 풍광이 빼어나고 인심이 곱고 풍속이 보배로운 제주는. 바야흐로 온 겨레의 가슴속에 살아 숨쉬는 마음의 고향이 되어. 세계 속에 찬연히 빛나는 매혹의 섬으로 각광을 받고 있습니다. 일찍이. 이처럼 거룩한 터전에 삶의 보금자리를 마련하고 살아온 제주 사람들은. 돌 많고 거친 바람의 고난을 이겨내면서. 아름다운 삼무의 전통을 꽃 피우고 수많은 전설들을 빚어내며 신화 어린 긴 역사를 영위해 왔습니다. 지금도 제주도에서는. 한라산에서부터 마을에 이르기까지 어디를 가나 「전설의 섬」이라고 부를 만큼 풍부한 설화들이 살아 숨 쉬면서 신비로움을 더하고 있습니다. 그러기에. 이러한 전설 속에는 제주만이 지닌 풍토적 조건과 그 위에 흘러간 역사를 엮어온 제주인들의 꿈이 깃들어 있으며. 우리는 이를 통해 선인들의 이상과 세계관과 생활의 양식을 읽어낼 수 있는 것입니다. 따라서. 우리 도에서는 도내 곳곳에 숨겨진 전설들을 캐어 내고 구슬처럼 꿰매어 이 고장 기층문화의 원류를 보존하고 후대에까지 전승시킴과 아울러 신비로운 제주의 참모습을 내외에 널리 선양하기 위해 이번에 이 「제주도 전설지」를 펴내게 되었습니다. 아무쪼록. 이 책자가 제주인들이 향유했던 정신세계를 탐구하고 나아가서는 빛나는 내일을 엮어 가는 정신적 밑거름을 창출하는데 활용되기를 기대하면서. 이 책을 발간하는데 애써 주신 조사위원을 비롯한 관계…","address":"제주특별자치도 서귀포시 대정읍 동일리 1706","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=521"},{"id":525,"name":"자구내 도대불","lat":33.309483,"lng":126.164381,"category":"민속","dir1":"생산기술","dir2":"어로기술","title":"자구내 도대불","subtitle":"","author":"제주특별자치도","keywords":"기타.차귀도.도대불.등대.돛대불","content":"돛대불'이라고도 하며 근대식 등대가 세워지기 전까지 사용되던 것으로 돌이나 나무 혹은 쇠로 만들어진 등대이다. 조업을 나간 배가 포구의 도대불을 보고 무사히 다시 돌아올 수 있게 하기 위함으로 마을의 어부들이 뱃일을 나가기 전에 불을 붙이고 귀항 시 불을 껐다고 한다. 횃불을 사용하거나 생선의 기름 또는 송진을 사용하였으나 근대에 들어서는 석유나 전기를 사용하였다. 자구내 포구의 도대불은 현무암을 벽돌모양으로 만들어 하나씩 쌓아가며 사다리꼴 형태로 만들었다. 오늘날은 사용하지 않고 있다.","address":"제주특별자치도 제주시 한경면 고산리 3616-18","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=525"},{"id":526,"name":"법환포구","lat":33.237225,"lng":126.515758,"category":"민속","dir1":"생산기술","dir2":"어로기술","title":"법환배염줄이포구","subtitle":"","author":"제주특별자치도","keywords":"법환.배염줄이.포구","content":"고려시대 묵호의 난이 일어나자 최영장군은 법환동 범섬으로 도망간 묵호들을 섬멸하기 위해 나무로 배를 엮어 범섬까지 연이어 다리를 만들었던 곳이다. 엮여진 배의 모습을 본따 지명을 배염줄이라고 하였다.","address":"제주특별자치도 서귀포시 막숙포로37번길 2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=526"},{"id":538,"name":"베릿내 오름","lat":33.247143,"lng":126.421961,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"제주 중문 베릿내 유적","subtitle":"","author":"한국관광공사/제주국제컨벤션센터/제주도민속자연사박물관","keywords":"중문.베릿내.유적.환경.시굴조사.출토유물","content":"조사지역은 서귀포시 중문동에 위치한 중문관광단지 동부(2단계)지역에 해당되는데. 관광단지 조성 이전에 1996년 제주대학교박물관에서 한국관광공사의 의뢰를 받아 지표조사를 실시한 바 있다. 이전에도 지표조사를 통해 조사지역 주변에 여러지점의 유물산포지 및 바위그늘집자리. 동굴입구집자리가 산재하고 있음이 알려져 있었다. 지표조사 결과 지표조사 기관인 제주대학교박물관에서는 유물이 산재해 있는 경작지 3필지에 대한 발굴조사의 필요성을 제기한 바. 관광단지 조성기관인 한국관광공사가 우리박물관으로 발굴조사를 의뢰하게 되었다. 발굴조사지역은 서귀포시 중문동 2673-1. 2675-1. 2675번지에 해당된다. 이 지역은 제주국제컨벤션센터가 자리 잡을 부지로 알려진 곳이기도 하다. 우리박물관에서는 사업의 타당성을 검토한바 학술적 기초자료를 확보하고. 매장문화재의 부존여부 및 보존에 대한 의견을 제시하기 위하여 조사를 계획하게 되었다. 학술용역계약은 우리박물관과 한국관광공사. (주)제주국제컨벤션센터와 체결하여 발굴조사를 실시하게 되었다. 조사결과. 수혈유구 3기. 구상유구 1기가 확인되었다. 그러나 자연적. 인위적 훼손이 심한 것으로 확인되었다.","address":"제주특별자치도 서귀포시 중문동 2314-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=538"},{"id":541,"name":"입산봉","lat":33.548239,"lng":126.753786,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"제주 김녕리 유적","subtitle":"","author":"제주도민속자연사박물관/건설교통부 제주개발건설사무소","keywords":"김녕리.유적.궤내기.궤네기","content":"제주도는 우리나라 남해안 최대의 섬으로 문화적인 특징이 다른 지방과 구별되는 독특한 지역이다. 제주의 선사문화 연구는 1970년대이래 고고학 조사를 바탕으로. 구석기시대에서 탐라시대까지 대체적인 윤곽을 잡는 단계에 이르렀다. 김녕리 지역에 대한 고고학적 조사는 우리 박물관에서 1991년부터 3년 동안 동김녕리 궤내기 동굴유적 발굴조사를 실시한 바 있으며. 이를 통해 이 지역이 이미 선사시대 이래 주민이 생활근거를 마련하였음을 확인하게 되었다. 이번에 발굴된 유적은 구좌읍 동 김녕리 입산봉 일대이다. 이곳은 제주일주도로 국도 12번에 대한 4차선 확장공사구간으로 제주-함덕 구간인 북제주군 구좌읍 김녕리 우회도로 포장공사구간 내 시굴조사를 통해 알려지게 되었다. 시굴조사를 마무리 할 무렵 도로예정구간에서 토사가 파헤쳐진 지점에서 신석기시대 타제석기와 원시무문토기 등이 출토되어 이 지점에 대한 본격적인 발굴조사로 이어졌다. 이러한 유적은 우리나라에서는 극히 드문 유적으로 제주도 고산리 유적이 알려져 있을 뿐이며. 신석기시대 초기유적에 해당되는 것으로 알려져 있다.","address":"제주특별자치도 제주시 구좌읍 김녕리 2121","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=541"},{"id":576,"name":"화천사","lat":33.506904,"lng":126.6102,"category":"민속","dir1":"무속","dir2":"신당","title":"석불","subtitle":"","author":"제주특별자치도","keywords":"석불.미륵","content":"석불의 여러가지 모습이다. 이 석불은 화천사가 창건되기 전부터 마을 미륵으로 모셔졌으며. 이 곳에서 치성을 드리면 득남의 효험이 있다하여 마을 사람들이 기자불공을 올렸던 곳이라고 한다. 자연석에 표현된 석불의 얼굴 형태는 모두 다르면서 자연스런 형상을 띠고 있다. \u003c발췌 : 제주도 무속신앙 대상 돌(石)의 이미지를 응용한 도자조형 연구 P34 2002년>","address":"제주특별자치도 제주시 회천동 2390-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=576"},{"id":578,"name":"미럭당","lat":33.499445,"lng":126.536842,"category":"민속","dir1":"무속","dir2":"신당","title":"물할망","subtitle":"","author":"제주특별자치도","keywords":"물할망.외새미.생불할망","content":"제주시 동광양 본향인 미럭당에 모셔진 미럭보살 물할망은 당옆의 샘물 외새미를 지켜주는 물할망이며 아기를 점지해주는 생불할망이다. 당에 갈 때는 해뜨기 전에 외새미의 물을 떠가서 빌었다고 한다.","address":"제주특별자치도 제주시 이도이동 379-6","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=578"},{"id":583,"name":"법화사지","lat":33.263572,"lng":126.459529,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"법화사지","subtitle":"","author":"서귀포시","keywords":"유적.출토.기와.유물.도자기.절","content":"법화사지에 대한 발굴조사는 1982년 서울 명지대학교박물관의 김홍식교수팀에 의해 1차 이루어졌습니다. 이를 통해 고려시대 후기 금당지라고 추정되는 건물지률 확인하는 성과를 올렸지만. 법화사 전체 가람 배치에 대해서는 충분한 자료를 얻지 못하였습니다. 그로부터 8년후 서귀포시는 법화사 구품연지 추정 구역에 대한 발굴조사의 계획을 세우고. 이를 우리 제주대학교박물관에 의뢰하게 되었습니다 1990一1992년의 2차에 걸침 연지추정지구에 대한 발굴조사를 통해 연지시설을 적극적으로 인정할 만한 고고학적 자료는 확인하지 못하였지만. 『신증동국여지승람』의 기록에 보이듯 고려 당시 연꽃 있는 물이 법화사 남쪽에 있음은 확인하였습니다. 연지추정지구에 대한 발굴조사 성과를 검토하면서. 발굴지도 위윈들은 기본적으로 전체 가람 배치에 대한 전반적이고도 체계적인 발굴 조사가 이루어져야 한다는 의견을 제시하였습니다. 그래서 1982년 지표조사를 통해 관물지가 있을 가능성이 있는 지역으로 추정된 금당지 북쪽 구역을 중심으로. 1992년 3차 발굴조사가 실시되었습니다. 그 결과 조선시대 전기의 건물지가 확인되고. 「중창십육년기묘필」명 기와와 운룡문 · 봉황문막새기와 등의 귀중한 유물이 다량 수습되었습니다. 결국 법화사는 고려 후기에 중창되고. 조선시대에 지속적으로 증개축 되었음이 고고학적으로 확인된 것입니다. 아울러 건물지와 기와보도 등의 부속시설이 서쪽으로 연…","address":"제주특별자치도 서귀포시 하원동 1071-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=583"},{"id":591,"name":"새미물","lat":33.506984,"lng":126.61061,"category":"민속","dir1":"의식주","dir2":"주생활","title":"새미물","subtitle":"","author":"제주특별자치도","keywords":"새미물.생명수","content":"제주시 회천동에는 화천사라고 사찰이 있다. 화천사에서 동쪽으로 약 40m 떨어진 곳에는 '새미'라는 용천수가 있다. 회천동 마을은 이 물을 생명수로 해서 생겼다 한다. 새미물에서 새미는 샘을 의미하며 이곳의 물은 만병통치약으로 불릴 만큼 유명하여 마을 사람들의 식수로 활용되었다. \u003c발췌 : 문화유적분포지도(제주시) P91. 1999년>","address":"제주특별자치도 제주시 회천동 2390-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=591"},{"id":594,"name":"금산","lat":33.433925,"lng":126.330672,"category":"민속","dir1":"기타","dir2":"해당없음","title":"조사연구보고서 제3집","subtitle":"1987년도","author":"제주도민속자연사박물관","keywords":"박물관.우장.도롱이.구석기.방묘.석상.어류.조류.금산","content":"탐라문화의 보급선양과 보존이라는 사명감속에 개관한 지 벌써 3년을 맞이하였습니다. 그간 본 박물관은 본도 교육 및 관광명소로 또한 제주문화의 창달이라는 책무를 다하고자 분야마다 특색 있는 민속유물과 자연사 자료 15.000여 점을 수집하여 전시 또는 연구. 보존을 하는 한편 미흡하고 빈약한 표본전시와 개체전시. 분야를 생태적이고 입체적인 전시방법과 음향시설로 세련되고 현대적인 감각과 수준에 맞게 보완해 나가고 있습니다. 이러한 발전은 오로지 귀하의 아낌없는 성원과 지도의 결실이라 생각됩니다. 이제 개관 3주년을 맞이하여 조사연구보고서 제3집을 발간하게 됨은 이 분야에 종사하는 우리들의 영광이라 자부하면서. 앞으로 지속적인 연구 활동을 통하여 더욱 우수한 조사보고서가 나오도록 최선을 다하고자 합니다.","address":"제주특별자치도 제주시 애월읍 납읍리 1457-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=594"},{"id":600,"name":"존자암","lat":33.3477,"lng":126.481982,"category":"민속","dir1":"기타","dir2":"해당없음","title":"한라산의 역사 · 유적","subtitle":"한라산총서3","author":"제주도/한라산생태문화연구소","keywords":"영실.유적.4.3.한라산.문화유적.역사.주변동굴.등반사","content":"한라산이라는 명칭의 사용 예나 지금이나 한라산은 주민 생활에 자원을 제공하는 터전일 뿐만 아니라. 사람들에게 신앙 행위의 대상으로 인식되는 존재이기도 하다. 한라산과 주민생활의 관계가 아주 오랜 옛날부터 생겨나 오늘날에도 이어지고 있음은 각종 사서(史書)를 통해 확인할 수 있다. 한라산이라는 명칭이 기록에 드러나는 것은 조선시대 1397년(태조6) 권근(權近)이 지은 어제시(御製詩)가 가장 이르다. 그는 탐라(耽羅)라는 시제(詩題)를 내걸고. 다음과 같은 시를 지었음이 태조실록 권11. 태조6년3월 신유(辛酉)조에서 확인되고 있는 것이다. 푸르르고 푸른 한 점의 한라산이. 만경창파 아득한 속에 멀리 있네. 사람이 별을 움직여 바다 나라에 왔었고. 말은 용의 씨를 낳아서 천한에 들어갔다오. 땅은 궁벽되나 백성들이 업이 있어 살아가고. 바람이 편하면 장삿배가 겨우 오고가오. 성명의 시대에 직방에서 판적을 꾸밀 때. 그 고장 누추하지만 부디 빠뜨리지 마옵소서.","address":"제주특별자치도 서귀포시 하원동 산1-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=600"},{"id":655,"name":"성널오름","lat":33.38485,"lng":126.619188,"category":"민속","dir1":"기타","dir2":"해당없음","title":"한라산의 지형 · 지질","subtitle":"한라산총서2","author":"제주도/한라산생태문화연구소","keywords":"한라산.지형.지질.화산.오름.용암","content":"제주도는 전체가 비교적 최근에 형성된 화산암과 화산쇄설암으로 구성된 섬으로 그 중심부에 남한에서 가장 높은 한라산이 형성되어 있으며. 오염되지 않은 울창한 밀림과 이국적인 식생. 맑고 투명한 대기. 수평선이 아득한 푸른 바다와 현무암질 암석이 만들어 내는 짙은 암색의 바위들이 함께 어우러져 빼어난 자연경관을 만들어 내고 있다. 또한 육지와 멀리 떨어진 채 한반도 최남단에 위치하고 있어 남국의 정열과 이국적 정취를 곳곳에 지닌 매우 낭만적인 제주도는 우리에게 언제나 상큼한 유혹으로 다가온다. 이렇게 자연이 베풀고 있는 아름다움과 신비로움은 제주도의 지하 심부에서 만들어진 마그마(magma)분출의 결과물이며. 마그마 분출은 지구 내부의 열을 식히기 위한 지구진화과정의 한 표현인 것이다. 우리의 지구가 이 광활한 우주에서 하나의 행성으로 아직 살아 있는 별임을 의미하는 것이다. 또한 지구를 연구하는 지구과학자들에게 마그마 분출은 지구 심부를 직접 접할 수 있는 귀한 자료인 것이다. 이렇게 수평적으로는 제주도의 낭만을. 수직적으로는 지구와 제주도의 진화체계에 대한 의미를 함께 경험한다는 것은 괜찮은 즐거움이 될 것이다. 제주도와 제주도의 한라산은 남한에서 화산체의 원형을 볼 수 있는 유일한 장소이며. 우리나라의 제4기 화산활동을 대표할 수 있는 지역으로 최근의 지질학적 사건을 이해하는 데 중요한 정보를 지니고 있다. 이러한 한라산과 제주도…","address":"제주특별자치도 제주시 조천읍 교래리 산137-24","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=655"},{"id":663,"name":"대정읍성","lat":33.249455,"lng":126.278752,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"대정읍성 학술조사 보고서","subtitle":"","author":"제주문화예술재단","keywords":"대정읍성.군현제.관아.문화","content":"대정읍성은 고려시대 군현제에서 조선시대 군현제로의 이행을 보여줌과 아울러. 조선시대 읍성의 조영 규범을 따르면서도 제주의 지역적 특색이 엿볼 수 있는 구체적 경관으로서 국가사적 의미가 크다고 하겠다. 한편. 대정읍성은 제주도 3대 문화권의 발상지 가운데 하나로서 조선왕조 500여 년 이래 제주도 서남부 문화권의 구심점이 되어 왔었던 곳이다. 이에 제주도 기념물 제12호 지정의 대정읍성에 대한 가치를 재발견 · 재검토하여 국가 사적지의 지정고시를 추진함과 아울러. 체계적인 관리 대책을 수립하는데 기초를 삼고자 한다.","address":"제주특별자치도 서귀포시 대정읍 인성리 2039","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=663"},{"id":704,"name":"무수천","lat":33.460193,"lng":126.447781,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"광령약사","subtitle":"","author":"광령1리","keywords":"마을지.지명.설촌.광령.향토사","content":"향토지를 발간한다는 계획을 세우고 만 2년이 지난 다음에야 겨우 한 권의 책을 묶게 됐다.모든 게 죄송스러울 뿐이다. 애초부터 너무 쉽게 생각하고 덤벼들었던 게 탈이었다. 이번 작업을 하면서 한 마을의 향토사를 정리하려면 적어도 5~6년의 오랜 시간과 심사숙고가 있어야만 하리라는 점을 새롭게 체득했다. 편집과정에서 도움을 주시던 두 분의 마을 고로(古老)께서 세상을 뜨셨다. 그래서 더욱 송구스럽다. 그러나 이 한권의 광령약사가 만족스럽지는 않더라도 제 2의 향토지가 만들어질 수 있는 토대를 마련할 수 있으리라는 기대감으로 죄스러움을 대신하며 여러분들의 해량을 바랄뿐이다.","address":"제주특별자치도 제주시 애월읍 광령리 4228","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=704"},{"id":709,"name":"와흘본향당","lat":33.50262,"lng":126.638869,"category":"민속","dir1":"민간신앙","dir2":"당굿","title":"와흘본향당 당제","subtitle":"","author":"제주특별자치도","keywords":"와흘본향당당제.와흘.본향당.본향당제.무속.신당.당","content":"와흘리 본향당은 '와흘 한거리 하로산당' 또는 노들당 이라고도 한다. 주민들이 나무를 신성시하여. 가지를 쳐낼 때도 반드시 제를 지냈다. 당에서 제를 지낸 뒤에는 곳곳에서 찾아온 사람들과 음식을 나누어 먹는다","address":"제주특별자치도 제주시 조천읍 와흘리 1274-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=709"},{"id":768,"name":"멜튼개","lat":33.521686,"lng":126.900095,"category":"민속","dir1":"생산기술","dir2":"어로기술","title":"새개와 멜튼개","subtitle":"","author":"제주특별자치도","keywords":"돌그물.원.원담.돌살.갯담","content":"제주시 구좌읍 하도마을 해안도로를 가로지르는 도로변 가까이에 '새개'와 '멜튼개' 가 자리해 있다. 그 뒷쪽으로 문주란 자생지로 유명한 토끼섬이 있다. '새개'는 서쪽에. 그리고 '멜튼개'는 그 동쪽에 있다. 새로 근래에야 축조했다고 하여 '새개'라 하고 멸치 떼들이 많이 몰려들어 잘 '뜨는' 개이기에 '멜튼개'라 한다. 이두개는 얼기설기 그 담을 축조했는데. 전체적으로 2.000여평은 족하다. 모래바닥위에 띄엄띄엄 돌멩이들이 보인다. \u003c발췌 : 제주도 제주민속유적 P318. 1997년>","address":"제주특별자치도 제주시 구좌읍 하도리 385-12","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=768"},{"id":769,"name":"별도봉","lat":33.519202,"lng":126.553084,"category":"민속","dir1":"기타","dir2":"해당없음","title":"별도연대","subtitle":"","author":"제주특별자치도","keywords":"별도봉.방어.연대.화북대.봉수대","content":"제주시 화북동 동쪽 연대동산에 있는 별도연대는 화분진에 소속되었으며. 화북 대라고도 부른다. 횃불과 연기를 이용하여 정치·군사적으로 급한 소식을 전하던 통신수단을 말한다.","address":"제주특별자치도 제주시 화북일동 4472","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=769"},{"id":799,"name":"높은오름","lat":33.455074,"lng":126.798399,"category":"민속","dir1":"기타","dir2":"해당없음","title":"바람의 고향 오름","subtitle":"서재철 제주 기생화산 사진집","author":"서재철","keywords":"오름.사진집.기생화산","content":"과학의 입장에서 보면 '오름' 생성은 화산활동의 결과이지만. 제주 사람들의 관념에는 한스러움이 빚어낸 자연작품이다. 우리 고장에는 '오름' 생성과 관련된 전설이 전해지는데. 그 내용은 대충 다음과 같다. 먼 옛날 '설문대할망'이라는 할머니가 있었다. 얼마나 거대했는지 한라산을 베개 삼아 누우면 두 다리는 제주시 앞 바다에 있는 관탈섬에 걸쳐졌다고 한다. 이 '설문대할망'은 빨래를 하려면 빨래감을 추자도에 얹어 놓고 한라산 꼭대기에 손을 짚고 서서는 발로 문질러 빨았으며. 길쌈을 할 때는 성산 일출봉에 등잔을 올려 놓아 했다고 할 만큼 거인이었다. 그 당시 제주 사람들은 육지와 자유롭게 왕래하기를 바랐지만 바다가 가로놓여 있어 불편함이 많았다. 이런 사정을 알고 있는 '설문대할망'은 속옷 한 벌만 만들어 주면 육지까지 다리를 놓아주겠다고 약속했다. 속옷 한 벌을 만드는 데는 명주 100동이 필요한데. 모으고 모으고 했지만 99동밖에 되지 않는다. 옷감을 모으는 사이에 이 할머니는 치마폭에 흙을 담아 다리를 놓는 작업을 했는데 이때 조금씩 흘러 내린 흙덩이가 '오름'이 되었다. 끝내 한 동이 부족하여 약속을 어기게 되고 다리를 놓는 작업도 중단되었다. 그래서 제주도는 아직도 육지와는 떨어져 물로 에워진 섬으로 남아 있다는 것이다. 백에서 하나가 부족하여 소원이 이루어지지 않았다고 하는 것은 아쉬움의 다른 표현이다. 아쉽다는 것 또한 슬픔…","address":"제주특별자치도 제주시 구좌읍 송당리 54-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=799"},{"id":845,"name":"신영물","lat":33.220147,"lng":126.251838,"category":"민속","dir1":"방언","dir2":"어휘","title":"우리 고유지명 유래집","subtitle":"","author":"남제주군","keywords":"고유지명.사투리.방언.지명.땅이름","content":"우리 고장의 각 마을에는 지역을 상징하는 우리 고유의 아름다운 지명이 있습니다. 그러나. 이에 대한 유래를 체계적으로 정리한 기록이 없어 안타깝게 생각하던 중 뜻 깊은 광복 50주년을 맞아 민족정기와 민족자존을 되찾는다는 차원에서 우리 지역의 고유지명에 대한 유래를 찾아 집대성한 책자를 발간하게 되었습니다. 지난 3개월간 관내 76개 각 마을별로 실태조사반을 편성하여 고유지명을 정밀조사 한 결과 우리 고장에는 일본식으로 개악된 지명이 없는 것으로 조사되어 선인들의 강한 자주의식을 발견할 수 있었음은 다행한 일이었습니다. 특히. 주민의견의 대부분이 구전으로 내려오는 고유지면을 사용하겠다는 것이기에 본 유래집을 발간하는데 큰 힘이 되었습니다. 우리 군 관내 2.100여개 지역의 지명유래가 수록된 이 책자에는 앞으로 자라나는 후세들에게 마을의 역사를 바로 알게 하고 이를 통한 애향심 고취에도 크게 기여하리라 생각합니다. 이 책자를 발간하기 위하여 많은 분들로부터 도움말을 듣고 방대한 자료를 수집하는데 최선을 다했습니다만 혹 미흡한 부분은 보완해 나갈 것을 약속드립니다. 아무쪼록 '우리고유 지명유래집'이 우리 남제주군 관내 마을의 역사와 군민들의 자존의식을 이해하는데 도움이 되기를 기대하는 바입니다.","address":"제주특별자치도 서귀포시 대정읍 하모리 938-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=845"},{"id":849,"name":"대평리난드르일뤠당","lat":33.240218,"lng":126.360893,"category":"민속","dir1":"무속","dir2":"신당","title":"대평리난드르일뤠당(입구)","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"난드르는 넓은 들판이라는 뜻의 대평리의 옛 지명이다. 당신은 닷방할망. 닷밧 일뤠중저이며 제일은 매달 7일 17일이다. 마을을 떠나는 등의 대소사가 있을 때는 꼭 들러서 고하고 간다고 한다.","address":"제주특별자치도 서귀포시 안덕면 감산리 934","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=849"},{"id":853,"name":"수정사","lat":33.262252,"lng":126.374807,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주문화 제6호","subtitle":"","author":"제주문화원","keywords":"제주문화.세시풍속.제주향교.종합문화공원","content":"현 외도초등학교 서편은 옛 고려시대 '수정사(修精寺)라는 사찰이 자리했던 터이다. 지금은 옛 사찰과는 직접적인 관련이 없는 동명의 수정사가 자리하고 있다. 그리고 토지구획 정리사업으로 주변이 새롭게 변모하고 있는 실정이다. 또한 그 주변에 조공천(朝貢川)이라 부르는 외도천이 자리하고 있고. 외도천 하류에는 월대(月臺)라 하여 옛부터 풍류객들이 풍류를 즐겼던 명승지가 있다. 수정사는 법화사 · 원당사와 더불어 고려후기 제주지역을 대표하는 3대 사찰로 알려져 왔다. 법화사는 그 동안의 발굴조사 등을 통하여 그 실체가 어느 정도 밝혀졌고. 이를 토대로 본격적인 복원사업을 전개하고 있다. 수정사는 1987년 제주대학교 박물관에서 지표조사를 통하여 대형 주초석과 각종 유물을 확인함으로써 사찰의 규모가 매우 컸을 것으로 추정되어 왔다. 그러나 1997년 이래로 제주시가 이 일대에 외도 토지구획 정리 사업을 전개하면서 유적의 중요성이 제기되어 왔음에도 불구하고. 이렇다 할 대책 없이 무리하게 사업을 전개하였다. 그러나 뒤늦게나마 유적에 대한 시굴조사가 시행되었다. 제주대학교 박물관에서 1998년 6월부터 4개월간 시굴조사를 실시하였다. 이 조사에서 고려 말 기와와 흑상감청자. 조선초 분청 등 도자기. 철제와 금동제유물. 화폐 등 다량의 유물을 확인함으로써 유적의 중요성이 크게 부각되었다. 이를 바탕으로 2차 확대 발굴이 2000년 2월부터 6월까…","address":"제주특별자치도 서귀포시 상예동 4721-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=853"},{"id":859,"name":"자장코지","lat":33.236926,"lng":126.437482,"category":"민속","dir1":"무속","dir2":"신당","title":"대포동좀녀당(지전물색)","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"대포동좀녀당'의 바위 상단의 신목에 걸려 있는 '지전'과 '물색'이다. 해녀들이 기원을 하고 지드림을 하는 당이다. 주로 생기 맞는 날에 다니며. 제물로는 상메 한그릇. 보시메 세그릇. 백지 서넉장. 광목 서넉장. 과일 등을 올린다. 보시메는 지를 싸는데 쓴다. 지드림은 올렸던 제물을 조금씩 떼어서 올렸던 종이에 나누어 싸서 실로 묶는것으로. 이것을 \"지\" 혹은 \"제\" 라고 한다. 이것을 바다에 던지는데. 이를 \"지드림\" 이라 한다. 지드림을 할 때 대개 \"요왕황제국님전이 요왕지 받 수다\" 라고 말한다. '대포동좀녀당'은 대포동 인근에 있는 \"자장코지\" 우뚝한 바위 위에 있다.","address":"제주특별자치도 서귀포시 대포동 2385","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=859"},{"id":862,"name":"법환동본향당","lat":33.233125,"lng":126.51221,"category":"민속","dir1":"무속","dir2":"신당","title":"법환동본향당(외부)","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"서귀포시 법환동 본향당의 외부 모습이다. 법환동 바닷가 인근에 있으며. 당을 옮기면서 새로 보수하여 다른 곳에 비하여 깔끔한 편이다. 이곳에는 서쪽. 북쪽에 제단이 있는데. 서쪽이 일뤠당이고 북쪽이 여드렛당이다. 앞당의 당신은 \"배염줄이 일뢰중자\" 이다. 마을에 사람이 죽으려 하면 먼저 이 본향당이 문을 닫는다고 한다. 앞당에 면해서 따로 당이 만들어져 있다. 원래 윌뤠당은 남해 앞바다에. 여드렛당은그 너머에 있었는데. 십여년전에 다니기 불편하다는 이유로 큰 굿을 하면서 당을 옮겨왔다고 한다. 당을 옮기는 결정은 심방이 하였다고 한다. 祭日은 따로 없고 각자 生氣 맞는 날로 택일하여 다니며. 제물은 각각 사발메 1그릇. 보시메 1그릇. 생선 한마리. 과일 등이다.","address":"제주특별자치도 서귀포시 법환동 1450-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=862"},{"id":876,"name":"각시당","lat":33.526674,"lng":126.891896,"category":"민속","dir1":"무속","dir2":"신당","title":"하도리각시당전경","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"각시당은 구좌의 해녀들이 주로 영등일인 2월 13일경 제물을 바치며 비념을 비는 곳이라고 한다.신동 해안도로변에 위치해 있다. 노천에 돌과 시멘트로 둘레를 두르고 제단을 만들어 모시고 있다. 옛날에는 1년에 한 번씩 각 동네마다 각시당으로 와서 큰당의 신을 모셔다가 당굿을 하였고 후에는 세 동네가 모여서 당굿을 하였으나 1984년 이후로는 하지 않는다고 한다. 당굿은 해녀들이 바다에 갈 때 궂은 일이 일어나지 않게 해달라고 빈다.","address":"제주특별자치도 제주시 구좌읍 하도리 450-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=876"},{"id":903,"name":"면수동본향당","lat":33.523247,"lng":126.865967,"category":"민속","dir1":"무속","dir2":"신당","title":"하도리면수동본향당","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"면수동 본향당(할망당)은 여씨 할머님이 강진에서 중이대소 선소님을 거느리고 하도에 좌정하였고 각시당. 요왕당. 선앙당. 달위당을 거는리는 여래불법 할마님이다. 재일은 정월 12. 영등 2.12 시만국대제날이다.","address":"제주특별자치도 제주시 구좌읍 하도리 3359-19","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=903"},{"id":937,"name":"매오름","lat":33.310112,"lng":126.813874,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"제주의 마을 시리즈16 표선리","subtitle":"섬 동남부의 중심마을","author":"오성찬","keywords":"표선.읍지.마을.지역.설촌.유래.역사","content":"우리가 역사를 정리하는 이유는 우리 선조들이 어떤 삶을 살아왔는가 방식과 뿌리를 밝히고. 그 중 슬기롭게 잘한 사례들은 후세에 계승하고. 잘 못한 실수들은 이것을 고쳐 바로잡으려 하는 데 있습니다. 긴 역사 동안 여러 고비에 많은 사람들이 그런 뜻을 세웠으나 이루지 못했던 것으로 우리는 압니다. 그러나 600년 동안에 이제 비로소 우리는 마을의 역사책을 갖게 되었습니다. 물론 처음 정리하는 것이라 부족한 부분도 있고 흠도 많을 것입니다. 그러나 우리 속담에 첫 술에 배 부르랴는 말이 있듯 이것을 기초로 하여 부족한 부분들을 보태고 잘못된 부분들을 다듬어 나간다면 머잖아 훌륭한 마을의 역사책이 완성될 것입니다.","address":"제주특별자치도 서귀포시 표선면 표선리 2441-9","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=937"},{"id":941,"name":"섯알오름","lat":33.205605,"lng":126.281085,"category":"민속","dir1":"기타","dir2":"해당없음","title":"갇힌 울음 열린 소리","subtitle":"","author":"오성찬","keywords":"4·3.고향.삼다도.우도.언어.서귀포.제주도","content":"제주도의 소위 ‘4.3사건’이 일어난 것이 1948년 4월 3일. 이 달로 꼭 만 40년이 된다. 이 40년 동안 이 사건은 외국인 존 메릴을 위시한 몇 사람에 의하여 단편적으로 거론된 적이 있을 뿐. 한 번도 전체적으로 조명된 바 없다. “지난 40년간. ‘4.3의 역사’는 지워진 것이 아니라 쓰여지지 않았으며. 잊어버린 것이 아니라 잊기를 강요당했을 뿐이었다”는 주장이 실감있게 들릴 정도이다. 심지어 사망 인원 등 피해상황까지도 그 동안의 기록은 각각이었다. 김남식의 \u003c남로당>과 제주도가 발행한 \u003c제주도>8호가 인명피해를 8만65명으로 기록하고 있는가 하면. 하성수의 \u003c남로당사>는 살상 인원을 8만5천여 명으로. 좌익사건에서 쓴 김봉헌의 \u003c濟州道 血の　歷史>는 7만명으로. 1960년 당시 제주도 국회의원 김성숙은 국회에 제출한 \u003c제주도 양민학살 건의안>에 5만 명으로. 또 1956년판 \u003c한국편람>은 4만여 명으로. 존 메릴은 그의 \u003c제주도 반란>에서 ‘최소한 당시 도민의 10%인 3만명은 죽었을 것’으로 추정하고 있다. 1982년 제주도가 발행한 \u003c濟州道誌>는 사망자를 2만7천7백19명. 중상을 1천80명. 행불 38명 등으로 기록하고 있다. 지난 2월 25일 제6공화국의 출범을 앞두고 민주화합추진위원회는 “8년 전에 있었던 ‘광주사태’에 대해서 정부가 사과하고 명예회복과 보상 등으로 8년 응어리를 풀어야 한다.”는 내용의 \u003c광주…","address":"제주특별자치도 서귀포시 대정읍 상모리 1618","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=941"},{"id":946,"name":"외도 월대","lat":33.49251,"lng":126.43574,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주시 통권 제7호","subtitle":"","author":"제주시","keywords":"제주시.세정증대방안.이스라엘.문예.시정.주요정책","content":"제주시 관내 삼양 ~ 외도간 일주포장이 이제 실현을 보게 되었다. 본도의 일주도로 포장에 앞서서 제주시 포장만이라도 하루 속히 이루어져야 한다는 시민의 열띤 소망은 벌써부터 행정의 중점사업으로 착안되고. 드디어는 추진체까지 마련하여 재원확보를 비롯한 온갖 방법을 예의 검토하고 있었던 사실을 시민 모두는 이미 잘 알고 있던 터이다. 그것이 이제 모든 애로를 무릅쓰고 햇빛을 보게 되어. 이 4월 중순부터 7월 중순까지는 삼양 ~ 외도간 총연장 10·5㎞의 완전포장을 예산 4천 3백만원을 들여 실현하게 되었다는 것은 다중적인 의미에 있어서 매우 기뻐해 마지않을 일이라고 생각한다. 사업의 내용인즉. 시내도심지 ~ 삼양간 5·3㎞선은 시발주로 실시하게 되고. 도심지 ~ 외도간 5·2㎞선선은 도 직영으로 각각 4월 중순부터 착공하게 되었는데. 삼양선의 경우는 해수욕 계절인 7월 중순까지는 완성해 놓을 목표아래 벌써부터 주민들의 골재재취를 서두르고 있는 형편이다. 이에 앞서 시에서는 작년부터 제주시일주도로 포장추진위원회를 민간체제로 구성하고 소요예산을 확장 국고보조와 시비를 제외한 자체부담액 20%를 조달하기 위해서 온갖 노력을 다하고 있었다. 공무원들의 급료에서 매달 50원씩을 갹출하게 된 것을 시범으로 하여 재일교포. 요식업소. 운수업 학생들까지도 모두 나서서 이 역대의 숙원사업을 실현을 위해서 일치된 열망을 집주하고 있었던 것이다. 이는 췌…","address":"제주특별자치도 제주시 외도이동 2552-7","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=946"},{"id":1008,"name":"외도천","lat":33.491981,"lng":126.435182,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주시 통권 제19호","subtitle":"","author":"제주시","keywords":"제주시정.제주시정계획.평가.새마을운동","content":"분발과 새로운 결의에 넘칠 소망의 새해를 맞이하여 본인은 먼저 시민 여러분의 가정마다 한없는 번영과 다복이 깃드시기를 충심으로 기원하는 바입니다. 돌이켜 보면 지난 해는 국내외적으로 격동과 긴장된 변화가 연쇄적으로 일어난 일 년이었으며 그에 따른 우리 시민적 각성이나 협조적 총화체제가 더욱 공고히 다져진 한 해였다고 확신합니다. 이러한 현실적인 어려운 긴장 속에서도 우리 제주시에 있어서는 시민총화의 각성을 거듭 촉구하면서 현시점에 처한 새로운 국가관의 정립에 주력하는 한편 소기했던 도시건설사업과 농어촌 개발사업에 충분한 목표성과를 거두었다고 확신하는 바입니다.","address":"제주특별자치도 제주시 내도동 640-05","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1008"},{"id":1047,"name":"신청사","lat":33.255528,"lng":126.510438,"category":"민속","dir1":"기타","dir2":"해당없음","title":"서귀포시 통권 제4호","subtitle":"","author":"서귀포시","keywords":"서귀포.문화.관광.전통.전설.월평마을.문예.시정","content":"우리 모두가 서 있는 이 자리는 지금으로부터 약 580년전 시청사 뒤에 우뚝 솟은 고근산을 기점으로 하여 대정현과 정의현이 나눠졌던 역사적인 경계선이었습니다. 또한 13년전 우리는 서귀읍민과 중문면민이 하나가 되어 서로 손에 손을 잡고 이 경계선에서 서귀포시민으로서 하나가 되는 서귀포시의 새로운 시대를 열었습니다. 이제 그 자리에 동서의 화합을 다지며 다시 시민의 자존인 새 청사를 세웠습니다. 민족의 영산 한라의 드높은 기상이 뻗어 내리고 태평양 푸른 물결이 한눈에 펼쳐지는 이 전원도시에 신청사가 우람한 모습으로 탄생된 것은 우리 모두의 큰 자랑이요 보람인 것입니다. 우리는 그동안 시로 승격되어 13년의 연륜을 쌓아 오면서도 읍사무소였던 낡고 협소한 건물을 시정의 살림집으로 사용해 왔습니다. 이것은 우리나라의 대표적인 아름다운 도시로 웅비하고 있는 서귀포시의 위상과 시민들의 기대에도 어긋나는 일이었습니다. 때문에 활기차게 뻗어가는 서귀포시의 모습에 걸맞는 시정의 전당을 세우는 것이 시민 모두의 한결같은 염원이었습니다. 마침내 소망이 튼튼한 초석으로 놓여지고 한 장 한 장의 탑처럼 쌓아 올려짐으로서 시민들의 자존을 상징하는 전당이 웅대한 모습을 드러내게 되었습니다. 이제부터 우리는 이 시정의 산실에서 맑고 힘찬 미래를 설계하고 지도의 선과 색채를 바꾸는 번영의 신화를 창조하는데 헌신의 힘을 쏟아 나갈 것입니다. 우리는 이제 한반도 남녘…","address":"제주특별자치도 서귀포시 법환동 731","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1047"},{"id":1090,"name":"한북교","lat":33.46694,"lng":126.516072,"category":"민속","dir1":"기타","dir2":"해당없음","title":"한라산의 하천","subtitle":"한라산총서 11","author":"제주도/한라산생태문화연구소","keywords":"하천.강수.지하수.용천수","content":"지표에 내린 강우는 식물이나 지표 위의 다른 물질들의 표면을 적신 후 지하로 침투하게 된다. 강우의 침투율은 토지이용. 토양의 특성과 수분량. 강우의 강도와 지속시간 등에 따라서 달라진다. 사질토양의 삼림에서는 시간당 25mm가 침투될 수 있지만 점토질 토양의 경우 시간당 수mm가 침투되며 사질토양이라도 농경지로 이용되는 경우 침투율이 산림지역보다 작아진다. 단위시간당 내린 강수량이 침투율보다 높은 경우에는 빗물이 경사진 지표면을 따라 낮은 곳으로 흘러내려(지표유출이라 함) 하천을 통해 바다로 이동한다. 한편 토양에 침투된 물중에서 일부는 지하로 계속 이동하여 지하수가 부존되어 있는 대수층에 도달하게 되며. 대수층에서 지하수는 아래로 또는 옆으로 이동하여 산사면이나 샘으로 배출되거나. 하천이나 해양의 바닥으로 스며나온다. 따라서 하천을 통한 유출은 지표유출이나 지표하유출 그리고 지하수유출에 의해 하천에 도달한 물이 경사진 하천을 따라 표고가 낮은 곳으로 흘러가는 것이라고 할 수 있다. 제주도에서는 대부분의 하천이 평상시에는 건천이며 많은 양의 강우가 내렸을 때 지표유출이나 지표하유출에 의해 2~5일간 유출이 발생한다. 또한 하천의 하류 일부 구간에서 지하수유출에 의해 하천유출이 발생한다.","address":"제주특별자치도 제주시 오라이동 43-16","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1090"},{"id":1094,"name":"석굴암","lat":33.402782,"lng":126.501978,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주도 통권 제14호","subtitle":"","author":"제주도","keywords":"신제주건설.재일교포.체신사업.향토개발.한일국교정상화.도정.주요시 U","content":"제주도라면 이내 돌이 많고 바람이 많고 여자가 많은 섬을 생각하게 된다. 사실 이조때는 죄인의 유배지였고. 가깝게는 부패한 정객들의 제물로서 마치 버림받은 이국의 땅처럼 취급되어 왔다. 그러나. 제주도의 역사는 1961년 5월 계기로 개도이래 처음 보는 근대화의 작업이 전개되었다. 즉 「속령」이 아니라는 「본토」요 「호기심의 대상」이 아니라 「행정의 대상」으로 새 시대의 각광을 받기 시작한 것이다. 그리하여 지난 3년간. 바람과 돌과 여자가 많다는 삼다의 섬은 이제 「재물」 「자원」 「아름다움」의 뜻으로 변해져 가고 있으며. 문자 그대로 비약적인 발전의 토대가 마련되어 가고 있다. 제주시 간선도로 포장. 한라산횡단도로 포장 등 도로의 정비확충을 비롯하여 중산간 부락에 수돗물이 공급되고 있으며. 사. 삼사건 이재민들을 원주지에 복귀시켰으며. 고구마. 유채 등의 환금작물 증산으로 농가소득을 향상시켰으며. 또한 제주 ~ 부산 제주 ~ 목포 간에 최신식 여객선이 취항하였으며. 이 외에도 육지부와의 무선전화 개통. 관광시설의 대폭적인 확충 등. 이상도 건설을 목표하는 여러 가지 작업이 줄기차게 진행되어 가고 있다. 그것은 종전. 제주 ~ 서울 간을 주에 세 번밖에 왕래하지 않던 여객기가 오늘날은 매일 2회씩 왕래하여도 언제나 만원으로 붐비고 있다는 사실만으로 보더라도 본도의 비약적인 발전상을 알기에 족할 것이다. 그러나 보다 더 긴 안목으로…","address":"제주특별자치도 제주시 노형동 산 20","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1094"},{"id":1172,"name":"어승생","lat":33.396057,"lng":126.489417,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주도 통권 제49호","subtitle":"","author":"제주도","keywords":"근대화.5.16.견월악.빌리.지방대학육성.전설.도정.문예","content":"오늘 제주방송국이 10kw로 출력을 강화하고 중앙방송국 TV중계소를 설치하여 그 개국을 보게 되는 성전(盛典)을 본인은 40만 도민과 함께 충심으로 축하하는 바입니다. 더구나 오늘의 개국을 보게 해 주신 신범식문화공보부장관을 대리하여 홍경모문화공보부차관께서 직접 왕림하셔서 저의 도민에게 축복을 주신데 비하여 감사를 드립니다. 그동안 제주방송국은 불비한 시설을 운영하면서도 항상 도민과 함께 생활하면서 필요한 지식과 신속 정확한 보도로서 도민의 벗이 되고 길잡이가 되어 왔습니다. 특히 지난해 「빌리」호 태풍 시에는 도내의 통신이 두절되어 당황하고 있을 때 철야방송을 통하여 도민의 귀가 되어주었고. 연말의 「남영호」 조난사고 시에도 직접간접 유족의 등불이 되어 아픈 가슴을 달래고 위로하여 그들을 어둠속에서 건져주는 중요한 역할을 아끼지 않았던 것입니다. 이와 같이 도민과 같이 웃고. 같이 서러워하면서 성년(成年)이 되어 왔습니다. 이제 본 방송국이 10kw로 시설이 증강되고 TV가 개국된다는 이 획기적인 사실은 확실히 도민의 기쁨이요. 또 동시에 우리도(道)의 또 하나의 발전의 거보인 것입니다. 우리 제주도는 분명히 말씀드려서 지난 10년 동안에 도(道) 다운 면목을 찾았고 발전도 5·16후에 비롯되었습니다. 육지에서 멀리 떨어져서 낙도의 후진을 벗지 못하고 있던 우리 제주도가 5·16혁명 후에 부각되기 시작하였으니. 먼저 「5·16도로를…","address":"제주특별자치도 제주시 해안동 산220-12","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1172"},{"id":1378,"name":"삼천서당","lat":33.513683,"lng":126.528308,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주도 통권 제40호","subtitle":"","author":"제주도","keywords":"삼천서당.성산일출.탐라어.제주도개관.후방기지론.탐라어","content":"정부에서는 1969년 이후 쌀의 자급자족을 위하여 여러가지 중점시책을 실시하고 있으며 그 대표적인 것으로는 수도 집단 재배가 있다. 여기에는 비료가격 인하를 비롯하여 농약가격인하 및 보조 병충해 방제. 농업용수개발 등을 들 수 있는데 그 중에서 병충해 방제 하나만으로도 종례 10a당 313kg의 수량을 370kg로 올려 약15%의 증수는 가능하기 때문에 방제비 5~10억원 내외의 투자로 방제에 총력을 경주하고 있음을 우리는 목견하고 있는 바이며 농업국이면서도 매년 식량이 부족하며 50~80만톤의 쌀을 도입하고 있음이 현실이라 하겠다. 병충해 방제만으로 이러한 부족의 생산량 확보와 외화소비를 막아 낼 수 있을 뿐만 아니라 50~100억 원 정도의 방제비 투자로 300억 원 이상의 증수효율을 높여 식량증산과 아울러 농가소득 증대에 기여할 수 있도록 농가 소득 증대에 기여할 수 있도록 하고 있음을 볼 때에 농업경영에 있어서 병충해 방제가 얼마나 중요한가를 짐작하고도 남음이 있는 것이다.","address":"제주특별자치도 제주시 일도일동 1198-9","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1378"},{"id":1454,"name":"연북정","lat":33.540108,"lng":126.636119,"category":"민속","dir1":"기타","dir2":"해당없음","title":"제주도 통권 제91호","subtitle":"","author":"제주도","keywords":"도지.문예.행정.오름.나그네.향토.발굴.도정","content":"돌하르방이란 말은 해방 이후에게 우리에게 익숙해진 이름이다. 아직도 지역에 따라 그 이름이 우석목. 무석목. 벅수머리 등 여러 가지로 불리고 있는데. 이는 그 서 있는 위치가 기능. 그리고 해학적인 모습 등에서 연유된 듯싶다. 그 형상은 마치 절해고도에 유배를 왔던 어느 어진 선비의 모습 같기도 하고. 잠시 밭갈이를 멈추고 먼 수평선을 바라보는 우리 할아버지의 인자한 모습 같기도 하고. 비가 오나 눈이 오나 누군가를 끊임없이 기다리는 사람 같기도 하다. 그렇다면 돌하르방은 언제 어디서 무엇 때문에 한반도의 본토는 건너뛰고 유배와 질곡의 땅 제주에 찾아왔을까. 그리고 맨 처음 제주의 현무암에 생명의 숨결을 불어넣은 사람은 누구였을까. 이런 물음에 대해 역사적인 기록은 거의 찾아볼 수 없으나 종합해 보면 서기 1754년. 방제사의 발의에 의한 것이었다 한다. 건립동기. 건립시기. 명칭을 확실히 단정지을 수는 없다. 학자들 간에 유입경로에 대한 의견이 엇갈리는 것도 사실이다. 제주. 대정. 정의의 삼주현성에 세워졌던 석상들의 기능은 과연 무엇이었을까. 무엇 때문에 이 석상들은 삼주현성의 성문 밖에 서 있었을까. 이를 해명할 만한 문헌은 아직까지 찾아 볼 수 없으나 마치 성문을 보초하여 수호하듯 서 있다는 점에서 수호신적 기능을 했다는 추측이 가능하며. 축술 종교적 기능. 위치표식 등의 기능을 했을 것이라는 주장도 있다. 어쨌거나 돌하르방은…","address":"제주특별자치도 제주시 조천읍 조천리 2690","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1454"},{"id":1533,"name":"검섯개","lat":33.548289,"lng":126.689591,"category":"민속","dir1":"의식주","dir2":"해당없음","title":"북제주군 문화유적분포지도","subtitle":"","author":"북제주군","keywords":"북제주군.문화.유적.지도","content":"문화유산은 우리 겨레의 삶의 예지와 숨결이 깃들어 있는 소중한 보배이자 인류문화의 자산입니다. 유형의 문화재와 함께 무형의 문화재는 모두 민족문화의 정수이며. 그 기반입니다. 더욱이 우리 문화유산은 오랜 역사속에서 많은 재난을 견디어 오늘에 이르고 있습니다. 그러므로 우리의 문화유산을 알고 찾아서 가꾸는 일은 곧 나라사랑의 근본이 되며 겨레사랑의 바탕입니다. 이번에 우리 북제주군이 제주대학교 탐라문화연구소에 용역의뢰하여 제작한 문화유적분포지도는 우리 지역의 소중한 문화유적을 보다 체계적으로 보존하고 관리해 나감은 물론 개발과정에서 무분별하게 훼손되는 것을 사전에 예방해 나가기 위한 목적이 있습니다. 북제주군 문화유적 분포지도에는 지정문화재 75건을 비롯하여 문화재적 가치가 있는 천연동굴. 봉수대. 연대. 포제단. 당. 원등 비지정 문화재를 포함하여 총 600여 건이 넘는 문화유적을 1/5만지형도에 나타내는 한편. 그 목록을 종류별. 지정문화재별로 일목요연하게 정리하였습니다. 이로써 북제주군지역에 산재해 있는 문화유적의 분포를 누구나 쉽게 상세히 알 수 있도록 함으로써 각종 개발사업의 시행단계부터 문화유적을 근본적으로 보호 할 수 있는 길이 열렸습니다.","address":"제주특별자치도 제주시 조천읍 북촌리 1193-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1533"},{"id":1635,"name":"건입동 칠머리당","lat":33.519063,"lng":126.548024,"category":"민속","dir1":"민간신앙","dir2":"당굿","title":"영등송별제배방선(영감놀이)","subtitle":"","author":"제주특별자치도","keywords":"영등송별제.영등송별제대일.칠머리당.칠머리당굿.영등굿.영등신.영등할망","content":"칠머리당굿에서는 배방선을 하기 직전에 영감놀이를 간단하게 연출하는데 이것은 다른 당의 영등굿에서 찾아보기 힘들다. 집에 환자가 있을시 영감신을 청해 환자를 영감신의 동생이라고 말하면 영감은 집나간 동생을 찾았다며 술을 주고받는다. 이후 서우젯소리에 맞추어 신나게 놀다가 짚배에 쌀. 물. 제주 명산물을 배에 가들 실으라고 하면 소미들이 무거운 물건인양 싣는다. 그러면 영감신들이 동생을 데리고 가는 양으로 그 배를 어깨에 메고 바깥으로 나가 배방선을 한다. \u003c발췌 : 제주도 무속과 그 주변 P98. 2002년>","address":"제주특별자치도 제주시 건입동 387-6","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1635"},{"id":1779,"name":"귀덕리 포구(진질개)","lat":33.442541,"lng":126.279048,"category":"민속","dir1":"생산기술","dir2":"어로기술","title":"귀덕리도대불","subtitle":"","author":"제주특별자치도","keywords":"귀덕리.도대불.등대.돛대불","content":"귀덕리 속칭 진질개라는 포구에 위치하는 옛 등대이다. 1930년경에 축조되었으며. 형태는 원통형이다. 현무암으로 쌓았으며 높이는 256cm이다. 도대불의 등화는 호롱불을 이용하였는데. 등화담당은 선창 가까이 거주하면서 일정한 생업이 없는 노인들로 하여금 담당하도록 하였다. \u003c발췌 : 북제주군 문화유적분포지도 P206. 2002년>","address":"제주특별자치도 제주시 한림읍 귀덕리 991-5","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1779"},{"id":1790,"name":"고산리 자구내항 안쪽(돔베성창)","lat":33.309815,"lng":126.164941,"category":"민속","dir1":"무속","dir2":"신당","title":"고산자구내개당(입구전경)","subtitle":"","author":"제주특별자치도","keywords":"무구.멩두.무속.신당.당.심방.본풀이.당제.고산자구내개당","content":"고산자구내개당의 입구전경이다. 고산리 자구내항 안쪽에 있으며 시멘트 담으로 가려져 있다. 아직도 찾는 이가 많은지 깨끗이 관리가 되어있다. 큰돌을 쌓아 지반을 높인 뒤에. 제단은 물론 울타리와 바닥까지 시멘트로 축조했다. 현무암을 정교하게 다듬어 자그마한 당집을 만들고. 그 안에는 할망신을 조각한 석상을 앉혀 놓았다. 울타리 너머 잡목에 물색이 걸려 있다. 당신은 개당 한집이다. 자구내 개당 또는 선주당 할망당이라고도 한다. 어선.해녀를 관장한다. 제일은 매달 초하루. 보름이나. 현재는 초하루에만 다닌다. 제물로는 메 2그릇과 돼지고기를 포함한 음식을 올린다. 어업에 종사하는 이들이 모두 이 당에 다닌다. \u003c발췌 : 북제주군 문화유적 분포지도 P229. 2002년>","address":"제주특별자치도 제주시 한경면 고산리 3616-15","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1790"},{"id":1904,"name":"중문 베릿내","lat":33.244128,"lng":126.419004,"category":"민속","dir1":"무속","dir2":"신당","title":"베릿내개당(입구)","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당","content":"베릿내(성천포) 포구의 입구이다. 입구는 나뭇가지에 가려 잘 보이지 않는다. 베릿내 포구의 해녀탈의장 옆에 있다. 높은 절벽 아래 자리 잡고 있는데. 관광객들이 자주 드나드는 곳이어서 천막을 친 상태이다. 제단은 온통 시멘트로 만들었다. 이 당에서는 붉은덕 일뤠할망을 모신다. 일렛당으로 제일은 6월 매 7일. 11월 매 7일이다. 바다일을 하는 어부들이 주로 모신다. \u003c발췌 : 서귀포 문화유적분포지도 P147. 2000년>","address":"제주특별자치도 서귀포시 중문동 275-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1904"},{"id":1972,"name":"다끄네포구","lat":33.518406,"lng":126.500745,"category":"민속","dir1":"무속","dir2":"신당","title":"다끄네 해신당(외부)","subtitle":"","author":"제주특별자치도","keywords":"당.신당.다끄네.해신당","content":"다끄네' 포구의 용담3동 어촌계 건물 옆에 있다. 돌담에 시멘트를 바른 정방형의 좁은 공간 한 쪽에 '해신지위'라고 새겨진 빗돌을 세워 놓았다. 빗돌 옆면에는 단기 4294년 3월 3일 진흥회에서 세운 것이라 기록하였다. 단기 4294년은 서기 1961년에 해당한다. 흔히 '갯당'이라 한다. 다끄내 잠녀와 어부들이 모시는 당이다. 음력 2월 영등달 14일에 영등굿을 벌인다. \u003c발췌 : 문화유적분포지도 P78. 1998년>","address":"제주특별자치도 제주시 용담삼동 1064-14","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=1972"},{"id":2006,"name":"섯물","lat":33.519741,"lng":126.492711,"category":"민속","dir1":"의식주","dir2":"주생활","title":"섯물내부(용담동)","subtitle":"","author":"제주특별자치도","keywords":"섯물.용천수.용천.생활용수.농업용수.식수.해안마을.용담","content":"섯물 내부의 모습이다. '동물'의 서쪽에 용천수가 있어 '섯물'이라고 한다. 섯물 바로 동북쪽에 있다. '섯물'가까운 곳에 있기 때문에 '섯물원'이라고 한다.   섯물이 흘러내리고 밀물 때 밀려든 바닷물이 서로 만나 고여 물웅덩이를 이루는 곳이다. \u003c발췌 : 문화유적분포지도 P65. 1998년>","address":"제주특별자치도 제주시 용담삼동 2292-26","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2006"},{"id":2010,"name":"왕돌앞당","lat":33.510896,"lng":126.483389,"category":"민속","dir1":"무속","dir2":"신당","title":"왕돌앞당전경(도두동)","subtitle":"","author":"제주특별자치도","keywords":"제주무속.무속.당.당제.신당.","content":"왕돌앞당전경의 모습이다. 몰래물 동네 바닷가 엉물동산 바위 아래 있다. 인위적인 시설물은 전혀 없다. 다만 바위에서 자생하는 잡목 줄기에 물색이 걸려있을 뿐이다.  이 당에서는 서출노비 혹곰이 조곰이 영감또 1신위를 모신다. 구사수동 (몰래물)사람들이 공항 확장 공사로 말미암아 제성부락으로 이주해 가는 바람에 폐당 위기에 처했었으나. 아직도 다니는 사람들이 있다. \u003c발췌 : 문화유적분포지도 P66. 1998년>","address":"제주특별자치도 제주시 도두이동 2607 바닷가 앞","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2010"},{"id":2018,"name":"모살원","lat":33.50903,"lng":126.470635,"category":"민속","dir1":"생산기술","dir2":"어로기술","title":"모살원과동물원(용담동)","subtitle":"","author":"제주특별자치도","keywords":"모살원.원.원담.돌살.갯담.","content":"용담3동에 속한 '어영'이라는 외딴 동네 앞에 있는 모살원이다. '동물'이라는 용출수에서 솟아 나온 담수가 동북쪽으로 흐르다 모여드는 15평 정도의 물웅덩이다.   그래서 '동물원'이라고 한다. 조간대 상층에 붙어 있으나 썰물에도 어느 정도 물웅덩이를 이룬다. 이곳에 멸치들이 곧잘 몰려 들었기 때문에 '원'이라 하지만. 거의 천연적으로 생긴 것이다. \u003c발췌 : 문화유적분포지도 P65. 1998년>","address":"제주특별자치도 제주시 도두일동 1727-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2018"},{"id":2128,"name":"홍효자비","lat":33.449966,"lng":126.885808,"category":"확장분야","dir1":"사회","dir2":"사회","title":"고성 홍효자","subtitle":"","author":"제주특별자치도","keywords":"신화전설.고성홍효자","content":"성산읍 고성리에 효자문거리라는 곳에 홍효자비가 있다. 집안이 매우 가난하였으나 부모님을 극진히 모셨다. 부친이 병환으로 자리에 눕자 부친의 대변 맛을 보면서 간호하였다. 현종 왕이 승하하자 향을 피워 놓고 통곡하였고 조정에서는 그가 죽은 후에 효자비가 내려졌다. \u003c발췌 : 제주의 민속 3권 (제주도)_p.57>","address":"제주특별자치도 서귀포시 성산읍 수산리 526-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2128"},{"id":2388,"name":"산지천","lat":33.515132,"lng":126.528957,"category":"민속","dir1":"민간신앙","dir2":"해당없음","title":"조천석제사터표지석","subtitle":"","author":"제주특별자치도","keywords":"산천단.한라신선제.제사터","content":"제주시내에서 바다로 흐르는 산지천 하류인 산지포구에서 고기를 낚는 모습이 아름다워 산포조어라 하여 영주 10경중 하나로 칭송 하였다. 산지천 안에는 조천이라는 표석이 있는데 가뭄으로 농사가 어려울때 기우제를 지내던 곳이다. \u003c발췌 : 즐거운 제주 P53. 2007년>","address":"제주특별자치도 제주시 건입동 1430","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2388"},{"id":2436,"name":"장수물","lat":33.455413,"lng":126.402165,"category":"확장분야","dir1":"역사","dir2":"고려시대","title":"삼별초군깃발","subtitle":"","author":"제주특별자치도","keywords":"항몽유적지.삼별초","content":"몽골에 맞서 삼별초가 최후까지 항쟁하다 전원이 순직한 삼별초의 마지막 보루였던 역사적인 장소. 이곳에는 또한 김통정 장군이 토성 위에서 뛰어내린 발자국이 바위에 파여 샘이 솟아나게 되었다는 \"장수물\"이다. \u003c발췌 : Welcome to 제주 P114. 2007년>","address":"제주특별자치도 제주시 애월읍 상귀리 1104-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2436"},{"id":2460,"name":"군산진지동굴","lat":33.252791,"lng":126.369949,"category":"확장분야","dir1":"역사","dir2":"일제강점기","title":"군산진지동굴내부에서본풍경","subtitle":"","author":"제주특별자치도","keywords":"진지동굴.일제시대","content":"일제시대에 일본군이 전쟁을 계속하기위해 소형의 특수잠수정이나 비행기. 곡사포 등 군수물품을 숨겨둘 목적으로 제주도민을 강제로 부역시켜 만든 곳이다. 제주시 사라봉. 명도암. 성산일출봉. 송악산. 우도 등지에 있다. \u003c 발췌 : 제주관광메뉴얼 P 55. 제주도 >","address":"제주특별자치도 서귀포시 안덕면 창천리 산1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2490"},{"id":2470,"name":"수월봉진지동굴","lat":33.299932,"lng":126.167904,"category":"확장분야","dir1":"역사","dir2":"일제강점기","title":"수월봉진지동굴","subtitle":"","author":"제주특별자치도","keywords":"진지동굴.일제시대.수월봉","content":"일제시대에 일본군이 전쟁을 계속하기위해 소형의 특수잠수정이나 비행기. 곡사포 등 군수물품을 숨겨둘 목적으로 제주도민을 강제로 부역시켜 만든 곳이다. 제주시 사라봉. 명도암. 성산일출봉. 송악산. 우도 등지에 있다. \u003c 발췌 : 제주관광메뉴얼 P 55. 제주도 >","address":"제주특별자치도 제주시 한경면 고산리 3672-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2509"},{"id":2480,"name":"셋알오름 일제 고사포진지","lat":33.206526,"lng":126.281047,"category":"확장분야","dir1":"역사","dir2":"일제강점기","title":"일본군탄약고","subtitle":"","author":"이어도사나","keywords":"일제시대. 진지동굴.일본군","content":"송악산 섯알오름에 위치했던 일본군의 탄약고. 지하에 구축된 일본군의 탄약고는 주변의 진지동굴로 이어지게 설계됐는데 훗날 4.3사건을 겪었으며 1950년 이곳에서 예비검속자 252명이 집단 학살되는 비극의 장소이기도 하다. 당시 희생된 사람들은 백조일손지묘에 안장돼 있다.","address":"제주특별자치도 서귀포시 대정읍 상모리 1590-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2524"},{"id":2490,"name":"서귀포수력발전소 터","lat":33.2463,"lng":126.555975,"category":"확장분야","dir1":"역사","dir2":"근대","title":"1950년대하논습지작업풍경","subtitle":"","author":"강병수","keywords":"서귀포.옛풍경.농사","content":"서귀포시에 현대적 의미의 도로가 개설된것은 일제시대인 1920년대 후반기 부터이고. 전기가 처음으로 들어온것은 1943년 천지연 하류에 서귀포수력발전소가 신설되면서부터이다. 서귀포 시민들이 기선을 이용한 것은 1913년 제주기선 회사가 생기면서부터이다. \u003c발췌 : 서귀포시의 어제와 오늘 . P54>","address":"제주특별자치도 서귀포시 서귀동 808-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2556"},{"id":2590,"name":"선덕사","lat":33.320578,"lng":126.593645,"category":"확장분야","dir1":"문화","dir2":"전통문화","title":"선돌선덕사일주문과코끼리상","subtitle":"","author":"제주특별자치도","keywords":"선덕사.선돌지역","content":"선덕사가 있는 ‘선돌’지역은 오래전부터 많은 수행승들이 하천변 토굴 등에서 수행을 하다가 산남지역으로 나아가 불사를 일으켰다고 전해 내려오는 예부터 불교와 인연이 깊은 곳이다.","address":"제주특별자치도 서귀포시 상효동 산86-16","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2590"},{"id":2611,"name":"귀덕리 거북등대","lat":33.446615,"lng":126.291371,"category":"확장분야","dir1":"사회","dir2":"사회","title":"거북등대","subtitle":"","author":"제주특별자치도","keywords":"무인등대.귀덕등대","content":"귀덕리에 있는 거북등대는 무인등대로 저녁 시간에 포구에서 바라보는 낙조는 한폭의 그림을 연상케 한다. 이 곳은 웨딩촬영과 특히 낚시터로 유명한데. 특이한 모습의 거북등대로 별다른 이정표가 없어도 쉽게 찾을 수가 있다","address":"제주특별자치도 제주시 한림읍 귀덕리 989-9","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2646"},{"id":2618,"name":"귀덕우물","lat":33.443781,"lng":126.293359,"category":"확장분야","dir1":"사회","dir2":"사회","title":"귀덕우물","subtitle":"","author":"제주특별자치도","keywords":"귀덕.거북등대.우물","content":"귀덕리에 있는 거북등대는 무인등대로 저녁 시간에 포구에서 바라보는 낙조는 한폭의 그림을 연상케 한다. 이 곳은 웨딩촬영과 특히 낚시터로 유명한데. 특이한 모습의 거북등대로 별다른 이정표가 없어도 쉽게 찾을 수가 있다","address":"제주특별자치도 제주시 한림읍 귀덕리 1020-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2618"},{"id":2633,"name":"동문시장","lat":33.511416,"lng":126.526193,"category":"확장분야","dir1":"사회","dir2":"사회","title":"동문시장","subtitle":"","author":"제주특별자치도","keywords":"재래시장.상설시장","content":"품질 좋은 제주 특산물들을 마음껏 고를 수 있는 재래시장 중에서도 규모가 가장 큰 상설시장이다. 저녁이면 포장마차 장이 서는 곳이다. 저렴한 가격에 푸짐한 안주와 술 한 잔을 나눌 수 있는 정겨운 시장이다. \u003c발췌 : 즐거운제주 P53. 2007년>","address":"제주특별자치도 제주시 이도일동 1436-7","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2633"},{"id":2636,"name":"모슬포항 등대","lat":33.214404,"lng":126.251742,"category":"확장분야","dir1":"사회","dir2":"사회","title":"모슬포항등대","subtitle":"","author":"제주특별자치도","keywords":"모슬포.등대","content":"제주도남서쪽 끝에 있으며 배후에 모슬봉(187m)·가시악을 등지고 있는 남서부 해안은 암석해안 또는 암초로 둘러싸여 천연의 방파제가 되고 있다. 포구는 중앙에 돌출한 작은 반도에 의하여 항구가 좌우로 양분된다. 포구는 항내가 좁을 뿐더러 배후지를 제주와 서귀포에 빼앗겨 어항으로서만 발전해 왔다","address":"제주특별자치도 서귀포시 대정읍 하모리 694-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2636"},{"id":2644,"name":"사계포구","lat":33.228259,"lng":126.306631,"category":"확장분야","dir1":"사회","dir2":"사회","title":"사계포구","subtitle":"","author":"제주특별자치도관광협회","keywords":"사계리.포구.산방산","content":"산방산 아래에 형성된 마을 사계리 포구로 산방산을 한눈에 볼수 있고 경치가 아름답다","address":"제주특별자치도 서귀포시 안덕면 사계리 2147-32","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2644"},{"id":2651,"name":"하모해변","lat":33.211302,"lng":126.261356,"category":"확장분야","dir1":"사회","dir2":"사회","title":"새우젓 드럼통","subtitle":"","author":"제주100년","keywords":"새우젓.모슬포","content":"멀리 모슬봉이 보이는 모슬포 해변에 새우젓 담근 드럼통이 여러 개 놓여 있고 드럼통에는 가마니를 덮어 봉해 놓았다. 트럭이 와 있는 것으로 보아 흥정 또한 잘 되는 모양이다.","address":"제주특별자치도 서귀포시 대정읍 하모리 279-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2651"},{"id":2662,"name":"소레포구","lat":33.239465,"lng":126.607741,"category":"확장분야","dir1":"사회","dir2":"사회","title":"소레포구","subtitle":"","author":"강병수","keywords":"소레포구.한라산","content":"날 맑은 날이면 한라산의 모습이 바다에 그대로 비추이는 보목동에 있는 포구로 한라산의 모습이 바다에 비치는 곳으로 유일한 곳이다.","address":"제주특별자치도 서귀포시 보목동 1400","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2662"},{"id":2676,"name":"화북포구","lat":33.524671,"lng":126.565573,"category":"확장분야","dir1":"사회","dir2":"사회","title":"원당오름과화북","subtitle":"","author":"제주특별자치도","keywords":"오름.원당봉","content":"조선시대에 제주의관문인 화북포구는 역사의 생생함이 그대로 담겨있는 곳이다. 제주사람들에게 포구는 거친 바다와 싸우며 삶을 일궈온 치열한 삶의 현장이자 제주문화의 원형을 찾을 수 있는 곳이다. 별도봉에서 바라보는 원당봉과 화북포구는 평화롭기 그지없다.","address":"제주특별자치도 제주시 화북일동 1619-6","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2676"},{"id":2690,"name":"제주측후소","lat":33.514636,"lng":126.529662,"category":"확장분야","dir1":"사회","dir2":"사회","title":"제주측후소 쪽에서 찍은 제주 시가지","subtitle":"","author":"제주100년","keywords":"제주시가.옛모습","content":"제주측후소 쪽에서 서쪽을 향하여 찍은 제주 시가지 모습이다. 이제 초가는 한 동네를 제외하곤 거의 찾아볼 수가 없다. 2~3층의 건물들이 들어서기 시작하여 고층화 현상이 일고 있음을 알아볼 수 있다.","address":"제주특별자치도 제주시 일도일동 1186","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2690"},{"id":2692,"name":"종달리 포구","lat":33.496945,"lng":126.911145,"category":"확장분야","dir1":"사회","dir2":"사회","title":"종달리포구","subtitle":"","author":"제주특별자치도관광협회","keywords":"종달리.도항선","content":"종달리 포구.우도로 가는 도항선이 취항하면서 제법 크게 확장된 포구다.지미봉에서 내려다 보는 포구와 일출봉 그리고 우도에 이르기까지 아름다운 풍경을 자랑한다.","address":"제주특별자치도 제주시 구좌읍 종달리 484-10","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2692"},{"id":2839,"name":"서귀포칠십리바닷가","lat":33.243637,"lng":126.56874,"category":"확장분야","dir1":"자연","dir2":"지구과학","title":"서귀포칠십리바닷가여명","subtitle":"","author":"강병수","keywords":"칠십리축제.축제","content":"서귀포항을 중심으로 해안선이 절묘하게 어우러진 칠십리에서 개최되는 축제. 제주목사행차 재현. 칠십리가요제. 서귀포 문화제 등이 열린다. \u003c발췌 : Welcome to 제주 P66. 2007년>","address":"제주특별자치도 서귀포시 서귀동 70-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2839"},{"id":2859,"name":"하도리 철새 도래지","lat":33.5117,"lng":126.895331,"category":"확장분야","dir1":"자연","dir2":"지구과학","title":"하도리철새도래지","subtitle":"","author":"제주특별자치도","keywords":"하도리.천연기념물","content":"매년 9월부터 12월 사이에 천연 보호 기념물로 지정 보호받고 있는 노랑부리저어새. 황새. 백로. 청둥오리. 원앙이등 철새들의 모습을 관찰 할 수 있다.주변에는 지하수를 이용한 송어. 숭어 양식장이 있는 까닭에 먹이가 풍부해 한겨울동안 이곳에서 지내기에 부족함이 없고. 비교적 조용하여 철새들이 서식하기에 좋은 새들의 낙원이다. \u003c발췌 : 즐거운 제주 P179. 2007년>","address":"제주특별자치도 제주시 구좌읍 하도리 53-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2859"},{"id":2869,"name":"고내 해안","lat":33.467184,"lng":126.337286,"category":"확장분야","dir1":"자연","dir2":"지리","title":"고내해안","subtitle":"","author":"제주특별자치도관광협회","keywords":"해안.고내","content":"제주도의 해안도로 중 거의 유일하게 경사가 있는 곳으로 과거 제주도민이 사용하던 천연 돌염전을 비롯해 각종 기암괴석이 곳곳에 있어 볼거리가 풍부하다.","address":"제주특별자치도 제주시 애월읍 고내리 1156-4","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2869"},{"id":2870,"name":"고망난돌쉼터해변","lat":33.510121,"lng":126.906457,"category":"확장분야","dir1":"자연","dir2":"지리","title":"고망난돌쉼터해변","subtitle":"","author":"제주특별자치도","keywords":"고망난돌.문주란","content":"쪽빛 바다위에 여유로워 보이는 우도가 정면으로 보이고 왼쪽으로는 문주란섬이. 오른쪽으로 성산일출봉이 보인다. 바다를 향한 벤치에 앉아 있으면 발아래는 철따라 예쁜 들꽃이 융단을 깔아 놓은듯하며 우묵사스레피 나무가 언덕을 덮고 있다. \u003c발췌 : 즐거운제주 P198. 2007년","address":"제주특별자치도 제주시 구좌읍 종달리 112-4","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2870"},{"id":2872,"name":"고산해안산책로","lat":33.304424,"lng":126.165148,"category":"확장분야","dir1":"자연","dir2":"지리","title":"고산해안산책로","subtitle":"","author":"제주특별자치도","keywords":"큰엉알.수월봉","content":"수월봉과 자구내 포구를 연결하는 해안도로를 따라 형성된 엉알 산책로에는 녹고의 눈물이 흐르고 있는 샘이 있다. 해안의 절벽은 파도에 깎여서 형성된 수중화산의 단면을 잘 보여주고 있다.","address":"제주특별자치도 제주시 한경면 고산리 3653-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2872"},{"id":2882,"name":"논짓물","lat":33.236825,"lng":126.388291,"category":"확장분야","dir1":"자연","dir2":"지리","title":"논짓물","subtitle":"","author":"제주특별자치도","keywords":"민물.경계선.천연수영장","content":"바닷물과 민물이 만나는 곳에 돌담으로 쌓아 만조 때면 바닷물이 들어와 주인행세를 하고 바닷물이 빠지면 민물이 주인이 되는 자연 그대로의 천연 수영장이다. \u003c발췌 : 즐거운 제주 P225. 2007년>","address":"제주특별자치도 서귀포시 하예동 532-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2882"},{"id":2891,"name":"원앙폭포","lat":33.301803,"lng":126.578931,"category":"확장분야","dir1":"자연","dir2":"지리","title":"돈내코원앙폭포","subtitle":"","author":"제주특별자치도","keywords":"돈내코.원앙폭포.상록수림","content":"깊은 골짜기와 폭포 울창한 난대 상록수림. 특히 계곡 한가운데 있는 높이 5m의 원앙 폭포는 매년 음력 7월 15일 백중날 제주 여인들이 여름철 물맞이 하는 곳으로 유명하다. \u003c발췌 : Welcome to 제주 P102. 2007년>","address":"제주특별자치도 서귀포시 상효동 1463","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2891"},{"id":2894,"name":"지미봉","lat":33.496894,"lng":126.906103,"category":"확장분야","dir1":"자연","dir2":"지리","title":"두산봉에서본지미봉","subtitle":"","author":"제주특별자치도","keywords":"오름.지미봉","content":"일주도로 구좌읍 종달 마을 입구 동쪽 방향에 있는 오름으로 산위 등성이는 원뿔모양의 동쪽 봉우리가 주봉이며. 정상봉 가까이의 안부에서 바닷가 쪽 으로 화구가 패어내려 말굽형 기생화산체를 이루고 있다. \u003c발췌 : 제주의 오름 1997. P284>","address":"제주특별자치도 제주시 구좌읍 종달리 산3-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2894"},{"id":2908,"name":"사계해변","lat":33.228256,"lng":126.308463,"category":"확장분야","dir1":"자연","dir2":"지리","title":"사계해안","subtitle":"","author":"제주특별자치도관광협회","keywords":"사계.해수욕장","content":"제주도내 다른 해수욕장에 비해 덜 알려진 관계로 아직은 맑은 수심과 고은 모래를 자랑하고 있다.좌로는 용머리 해안이.우로는 송악산이 그림같이 펼쳐져 있고 마라도 해상유람뿐만 아니라 스킨 스쿠버 다이빙 체험 관광을 선택할 수도 있다. 송악산 사계 해수욕장 부근에는 물이 맑고 깨끗한 스킨 스쿠버 다이빙 포인트가 위치해 신비로운 바닷속 세계를 경험하는 이색 투어가 가능하다","address":"제주특별자치도 서귀포시 안덕면 사계리 131-8","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2908"},{"id":2912,"name":"산지등대","lat":33.521261,"lng":126.545478,"category":"확장분야","dir1":"자연","dir2":"지리","title":"산지등대(별도봉에서 바라본 전경)","subtitle":"","author":"제주특별자치도","keywords":"등대.무인등대","content":"1916년 10월 무인등대로 처음 점등된 산지 등대는 1917년3월에 유인등대로 변경되어 1999년 12월까지 83년 동안제주항의 관문 역할을 해냈다. 바다를 붉게 물들이며 넘어가는 사봉낙조의 황홀함에 빠져들 즈음이면 고기잡이 나가는 수십척의 배가 불을 밝혀 장관을 연출했다. \u003c발췌 : 즐거운 제주 P55. 2007년>","address":"제주특별자치도 제주시 사라봉동길 108-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2912"},{"id":2937,"name":"안덕계곡","lat":33.254404,"lng":126.350603,"category":"확장분야","dir1":"자연","dir2":"지리","title":"안덕계곡","subtitle":"","author":"제주특별자치도","keywords":"계곡.안덕.용천수","content":"조용하고 쾌적하며 가족단위. 팀단위의 여행객들에게 좋다.항상 맑은 시냇물이 흘러내리고 맑은 용천수가 솟아나오는곳이 많고 천상의 바위들은 물에 닳아 한층 자태가 곱다. \u003c 발췌 : 제주관광메뉴얼 P 51. 제주도>","address":"제주특별자치도 서귀포시 안덕면 감산리 1946","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2937"},{"id":2938,"name":"알오름군락","lat":33.329988,"lng":126.777995,"category":"확장분야","dir1":"자연","dir2":"지리","title":"알오름군락","subtitle":"","author":"제주특별자치도관광협회","keywords":"오름.알오름","content":"제주의 368개 오름 중에서 세 개의 분화구와 알 오름이 있는 복합형 오름이다. 이 오름 자락에는 굵은 선으로 네모칸을 그린듯한 산담이 멀리서도 확연하게 들어오는 것만으로 보아도 명당자리가 많음을 짐작케 한다.용이 누워 있는 형상이라 용눈이 오름이라 불리고 있다. \u003c발췌 : 즐거운제주 P73. 2007년>","address":"제주특별자치도 서귀포시 표선면 토산리 산11","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2938"},{"id":2941,"name":"오조리철새도래지","lat":33.463143,"lng":126.915385,"category":"확장분야","dir1":"자연","dir2":"지리","title":"오조리철새도래지","subtitle":"","author":"제주특별자치도","keywords":"오조리.철새도래지","content":"오조리철새도래지는 오조리 해안에 위치하고 있으며 숭어를 양식하고 있고 해조류가 풍부하며 갈대밭이 넓게 분포하고있다. 수심은 120cm 정도이고 면적은 1.54평방킬로미터이다. \u003c발췌 : 제주의 습지2 . P114>","address":"제주특별자치도 서귀포시 성산읍 오조리 2210","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2941"},{"id":2945,"name":"온평리 해안","lat":33.415988,"lng":126.910528,"category":"확장분야","dir1":"자연","dir2":"지리","title":"온평리해안","subtitle":"","author":"제주특별자치도","keywords":"해안.용수리","content":"온평리는 삼성혈과 삼성신화의 이야기와 연결된다. 삼성신화에 나오는 목함을 발견하고 뭍으로 끌어 올렸던 곳이 온평리 해안이고. 결혼을 하였던 곳이 혼인지이다. \u003c발췌 : 즐거운 제주 P180. 2007년>","address":"제주특별자치도 서귀포시 성산읍 온평리 66-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2945"},{"id":2949,"name":"용수리 해안도로","lat":33.323724,"lng":126.166017,"category":"확장분야","dir1":"자연","dir2":"지리","title":"용수리해변","subtitle":"","author":"제주특별자치도","keywords":"해변.용수리","content":"용수리는 아름다운 해안도로가 협재 부터 이어져 있어 국도를 타고 해안도로를 따라 올라오면 제주도의 해안 풍치를 맛 볼 수 있다.","address":"제주특별자치도 제주시 한경면 용수리 4274-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2949"},{"id":2959,"name":"이달봉","lat":33.3624,"lng":126.345292,"category":"확장분야","dir1":"자연","dir2":"지리","title":"이달봉","subtitle":"","author":"제주특별자치도","keywords":"오름.이달봉","content":"이달봉은 새별오름 서쪽에 이웃해 2개의 봉우리로 이루어져있다. 이달봉은 이달 이촛대봉과 함께 원추형 쌍둥이 화산체라고 할수 있다. 이달이촛대봉의 정상부에는 용암유출흔적인 화산암이 노출되어 있다. \u003c발췌 : 제주의 오름 1997. P245>","address":"제주특별자치도 제주시 애월읍 봉성리 산71-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2959"},{"id":2960,"name":"서림물","lat":33.238979,"lng":126.22853,"category":"확장분야","dir1":"자연","dir2":"지리","title":"일과리해변","subtitle":"","author":"제주특별자치도","keywords":"해변.일과리.대정.생활용수","content":"제주도 서귀포시 대정읍에 있는 리이다. 생활용수를 공급하는 서림수원지가 있으며. 많은 용천이 있어 식수가 풍부한 마을이다.","address":"제주특별자치도 서귀포시 대정읍 일과리 1293-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2960"},{"id":2975,"name":"도순다원","lat":33.272478,"lng":126.483071,"category":"확장분야","dir1":"자연","dir2":"지리","title":"제다녹차밭","subtitle":"","author":"제주특별자치도관광협회","keywords":"녹차.명차.다원","content":"한라산중턱을 끝도 모르게 이어진 차밭. 유배생활을 하던 추사가 차 한 잔에 마음을 달래며 세한도를 그리고 추사체를 완성했을 그때가 눈앞에 아른거린다. \u003c발췌 : Welcome to 제주 P101. 2007년>","address":"제주특별자치도 서귀포시 도순동 1-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2975"},{"id":2988,"name":"칡오름","lat":33.477139,"lng":126.612434,"category":"확장분야","dir1":"자연","dir2":"지리","title":"칡오름","subtitle":"","author":"제주특별자치도","keywords":"오름.칡오름","content":"명도암마을입구에 위치한 오름으로 북. 남쪽에 두개의 독립된 봉우리로 이루어진 쌍둥이의 원추형 화산체로서 큰 봉우리를 큰오름. 작은봉우리를 족은오름이라고 하여 따로 부르고 있다. \u003c발췌 : 제주의 오름 1997. P149>","address":"제주특별자치도 제주시 봉개동 466-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2988"},{"id":2992,"name":"송악산 해안동굴","lat":33.206047,"lng":126.289732,"category":"확장분야","dir1":"자연","dir2":"지리","title":"해안동굴","subtitle":"","author":"제주특별자치도관광협회","keywords":"송악산.올인촬영지","content":"올인 촬영지\"송악산\" 쪽빛바다와 언덕이 아름답게 어울리는 크고 작은 봉우리들이 모여 있는 송악산에서 드라마 올인 촬영을 하였다. 멀리 우리나라 최남단인 마라도가 보이고 비가 조금만 내려도 가라앉을듯한 가파도가 한 폭의 그림처럼 떠 있다. 멀리로는 한라산이 보이고 동쪽으로는 산방산과 용머리 해안이 시야에 들어오고 형제섬도 보인다. \u003c발췌 : 즐거운 제주 P241. 2007년>","address":"제주특별자치도 서귀포시 대정읍 상모리 179-4","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=2992"},{"id":3002,"name":"강정천","lat":33.232636,"lng":126.489534,"category":"확장분야","dir1":"관광","dir2":"관광명소","title":"법환(막숙) 해안","subtitle":"","author":"강병수","keywords":"강정천.강정마을","content":"손에 닿을 듯 말듯 한 범섬을 지적에 두고 있는 법환해안은 해돋이와 해넘이를 찍으려는 사진작가들이 많이 찾는 장소중의 하나이기도 하며 영화 촬영지로도 유명하다.","address":"제주특별자치도 서귀포시 강정동 5647 외","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3002"},{"id":3079,"name":"성읍 남문성","lat":33.385692,"lng":126.801694,"category":"확장분야","dir1":"관광","dir2":"관광명소","title":"성읍남문성","subtitle":"","author":"제주특별자치도","keywords":"민속마을.성읍","content":"제주의 옛 초가. 향교. 관공서. 돌하르방. 연자방아. 성터.비석이 그대로 보호되고 있는 민속마을이다. 제주 고유의민요. 민속놀이. 향토음식. 민간공예. 제주방언 등의 무형문화유산과 함계 천연기념물 제161호인 느티나무. 팽나무의 운치도 이곳만의 기품을 더해준다. \u003c발췌 : Welcome to 제주 P136. 2007년>","address":"제주특별자치도 서귀포시 표선면 성읍리 3294","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3079"},{"id":3125,"name":"황우지열두굴","lat":33.241906,"lng":126.55069,"category":"확장분야","dir1":"관광","dir2":"관광명소","title":"천연해수풀장","subtitle":"","author":"제주특별자치도","keywords":"해수풀장.외돌개","content":"외돌개 주차장에 차를 세워놓고 길 건너 바다 솔빛 찻집이 있는 계단으로 내려가면 바다로 가는 길이 이어져 있다. 황우지 열두굴로 내려가는 가파른 나무 계단을 내려가면 문섬이 보인다. 그 밑으로 선녀들이 내려와 목욕을 했음직한 해수천연풀장이 나온다. 풀장은 깊은곳. 얕은곳 두곳이 있어 어린이들도 안심하고 즐길수 있다. \u003c발췌 : 즐거운 제주 P145. 2007년>","address":"제주특별자치도 서귀포시 서홍동 764-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3125"},{"id":3146,"name":"한라산 고산습지","lat":33.357557,"lng":126.463406,"category":"확장분야","dir1":"관광","dir2":"관광","title":"1100고지고상돈묘역","subtitle":"","author":"제주특별자치도","keywords":"1100고지.습지","content":"1100도로는 드라이브 코스로서 한번쯤은 다녀왔을 것이다. 그러나 한라산의 고산습지가 있다는 것을 아는 사람은 그리 많지 않을 것이다. 1100고지습지는 야생화의 천국이며 한라산에서만 볼 수 있는 생물들의 서식 하는 곳이다. 지금은 습지를 훼손하지 않고 관찰할 수 있도록 친환경적인 나무데크길로 정비를 잘 해 놓았다. \u003c발췌 : 즐거운 제주 P93. 2007년>","address":"제주특별자치도 서귀포시 색달동 산1-2","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3146"},{"id":3164,"name":"붉은오름 자연휴양림","lat":33.401645,"lng":126.675313,"category":"확장분야","dir1":"관광","dir2":"관광","title":"교래리보호수","subtitle":"","author":"제주특별자치도","keywords":"교래리.중산간마을","content":"마을이 해발 421고지에 자리하고 있고 한라산 동쪽에 위치한 중산간 마을이며 목가적인 전원풍경으로 가족단위 관광객이 많이 찾는다. 자연마을로는 구두악. 물오름. 성오름. 붉은오름이 있다. 구두악은 마을 뒷산 모양이 개 머리와 비슷하다 하여 붙여진 이름이다. 물오름은 산에서 생수가 나온다 하여 붙여진 이름이다. 성오름은 마을 뒷산이 절벽같이 되었고 성을 쌓은 형상이라 하여 붙여진 이름이다. 붉은 오름은 마을의 흙이 붉다는 데서 붙여진 이름이다.","address":"제주특별자치도 서귀포시 표선면 가시리 산 158","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3164"},{"id":3240,"name":"명월 팽나무군락","lat":33.387594,"lng":126.266171,"category":"확장분야","dir1":"관광","dir2":"관광","title":"명월리느티나무(겨울)","subtitle":"","author":"제주특별자치도","keywords":"명월리.명월진성","content":"마을 동구 밖에는 명월리 설촌 유래를 알리는 표석이 마을을 찾는 이방인을 맞이하고 있다. 명월천이 시작되는 마을 입구부터 꽤나 오랜 세월을 지켜온 듯한 아름드리 팽나무가 즐비하게 서 있다. \u003c발췌 : 즐거운제주 P101. 2007년>","address":"제주특별자치도 제주시 한림읍 명월로 71","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3240"},{"id":3267,"name":"솜반천","lat":33.25335,"lng":126.553013,"category":"확장분야","dir1":"관광","dir2":"관광","title":"봄이시작되는공원","subtitle":"","author":"제주특별자치도","keywords":"걸매.생태공원","content":"걸매란 \"물도랑이 자주 막혀 메워져 있는 곳\"이다. 솜반천에서 흘러 내리는 계곡에 인간과 자연이 공존하는 생태공원을 조성하였으며 일급수에서만 서식하는 송어와 천연기념물 원앙새 등 철새를 만날수 있다. \u003c발췌 : 즐거운 제주 P145. 2007년>","address":"제주특별자치도 서귀포시 서홍동 2565","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3267"},{"id":3315,"name":"성김대건신부 제주표착기념관","lat":33.322849,"lng":126.167724,"category":"확장분야","dir1":"관광","dir2":"관광","title":"성김대건신부제주표착기념관","subtitle":"","author":"제주특별자치도관광협회","keywords":"김대건신부.기념관","content":"김대건 표착기념관은 배 모양의 건물로 김대건 신부가 상해에서 사제서품을 받고 서해바다로 귀국하기 위해 타고 온 배가 풍랑을 만나 용수리에 표착하였던 자리로 1999년에 순례지로 선포한 곳이다. 고증에 의해 150년 전의 모습을 복원한 하파엘호는 마당 한켠에 전시되어 있다. \u003c발췌 :즐거운제주 P123. 2007년>","address":"제주특별자치도 제주시 한경면 용수리 4266","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3315"},{"id":3349,"name":"쇠소깍해변","lat":33.251553,"lng":126.623122,"category":"확장분야","dir1":"관광","dir2":"관광","title":"효돈동쇠소깍검은모래해변축제(먹거리장터)","subtitle":"","author":"제주특별자치도","keywords":"하효동.효돈청.쇠둔.축제","content":"효돈동 쇠소깍 검은모래해변축제의 먹거리 장터에서는 제주 고유의 각가지 토속음식들을 즐길수 있으며 제주 흑돼지 바비큐가 제일 인기가 좋다.","address":"제주특별자치도 서귀포시 하효동 997-3","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3349"},{"id":3618,"name":"반딧불이 보호구역","lat":33.24132,"lng":126.396413,"category":"확장분야","dir1":"관광","dir2":"관광","title":"반딧불이 보호구역","subtitle":"","author":"제주특별자치도","keywords":"반딧불.반딧불이 보호","content":"2002년 전국 `반딧불이 보호구역` 제1호로 지정된 곳으로 8월 말에서 9월 중순까지 캄캄한 여름밤이면 인근 마을에 반딧불이 꽁무니에 불을 켜고 돌아다니는 모습을 심심치 않게 볼수 있다. \u003c발췌 : 즐거운제주 P225. 2007년>","address":"제주특별자치도 서귀포시 상예동 5001-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3618"},{"id":3717,"name":"공천포","lat":33.26342,"lng":126.641112,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"공천포지(공천미)","subtitle":"","author":"남원읍 신례2리","keywords":"공세미.예래동.영등물","content":"예래 2리는 해안선을 따라 넓은 모래판이 펼쳐져 있고 그 중간 중간에서는 깨끗한 생수가 용출하여 식수로 이용되고 있으며. 여름 철에는 물난밭에서 나는 물이 골창물이라는 도랑을 이루며 바다로 흘러내리는 등 예부터 수자원이 풍부하였다. 특히 새까만 모래알들과 그 모래알 사이로 샘솟는 이 마을의 젖줄 '영등물'은 예래 2리 에서 빼놓을 수 없다. 비단 이것 뿐만이 아니라 예래동은 현대에 이르러서도 깨끗한 제주 속에서도 청정 환경을 토대로 하는 생태마을로 꼽히고 있고. 상고시대의 유물과 유적인 '고인돌'과 '왜왓'도 빼놓을 수 없는 예래 2리의 이야기거리이다. 그 외에도 마을의 개괄적인 내용을 비롯하여. 마을의 형성과 변천에 관련된 설촌 유래. 지명 유래. 한문서당과 같은 이 고장의 역사. 문화에 대하여 살펴볼 수 있다. 생활의 변천사를 담은 의.식.주 생활과 고장의 관혼상제와 세시풍속. 일제하에서의 생활. 사건사고. 또한 제주의 아픈역사인 4.3사건 역시 기록되어 있다. 해안마을 답게 어로(漁撈)의 변화. 그리고 기타 방언이나 민요. 속담 등도 함께 실려 있다.","address":"제주특별자치도 서귀포시 남원읍 신례리 72-18","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3717"},{"id":3734,"name":"고내봉","lat":33.457352,"lng":126.340551,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"고내리지","subtitle":"","author":"김봉옥","keywords":"마을지.북제주군.리지","content":"해안절경이 뛰어난 마을 고내리 향토지이다. 1980년. 뜻있는 마을 관계자들과 재일향민들의 적극협조로 발간되었다. 마을의 위치와 자연환경. 설촌과 성씨. 마을의 향약. 민속문화.고내팔경 등을 향토사학자 김봉옥씨가 자료를 수집조사해 편집했다.","address":"제주특별자치도 제주시 애월읍 고내리 산3-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3734"},{"id":3743,"name":"정의현성","lat":33.386948,"lng":126.799951,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"옛날엔 영 살았젠","subtitle":"","author":"제주시교육청","keywords":"제주향토학습.제주인의생업.제주세시풍속.제주민속신앙.제주어","content":"이 책에서는 제주의 선사시대의 유적(라영숙). 행정과 대외 교류(좌진영). 제주의 방어 시설(양수열). 민초들의 저항(하명실). 제주에 유배 온 사람들(양인숙). 제주인의 생업(이양신). 의식주 생활(고영호). 제주의 세시풍속(장승심). 민속신앙(고영철). 제주어(강경수)의 내용을 다루고 있다. 그 동안 제주지역에서는 구석기에서 초기 철기 시대에 이르는 유물과 유적들이 발굴되었으며 이들을 바탕으로 제주 지역 선사인들의 삶을 짐작 해 볼 수 있다. 구석기 유적인 빌레못 동굴 유적에서 출토된 석기류와 동물뼈 화석을 통해 추정해 보면 제주에서는 약 4만년 전 이전에 인류가 생활하고 있었음을 추정할 수 있다. 고대 탐라국이 언제 형성되었는지. 또 그 규모는 어떠했는지에 대해서는 잘 알 수가 없지만. 탐라전기시대의 기록을 참고하면 기원후부터 약 500년까지라 하겠다. 탐라의 형성과 관련된 것으로 제주시 용담동 월성마을(먹돌새기)에 있는 용담동 무덤 유적이 있다. 여기서는 철제장검과 단검. 도끼 등의 유물이 발견되었다. 이것들은 실제 전투용의 무기들이 아니라 자기의 고귀한 신분이나 힘을 자랑하기 위한 물건들이었다. 또한 중국 것으로 여겨지는 유리구슬 제품이 발견되었는데 이는 철제무기류와 유리구슬 등이 발견된 무덤의 주인공들은 자신들의 사회적 지위를 자랑하기 위한 물품들을 얻기 위하여 한반도와 중국까지 교역한 국(國)의 수장(首長)계층이었다고 추…","address":"제주특별자치도 서귀포시 표선면 성읍리 820-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3743"},{"id":3773,"name":"귤림서원","lat":33.510438,"lng":126.525713,"category":"확장분야","dir1":"역사","dir2":"근대","title":"제주 오현 조사","subtitle":"","author":"탐라문화연구소","keywords":"오현.귤림서원.사학.교육기관","content":"제주오현(五賢)은 귤림서원(橘林書院) 에 배향되었던 다섯명의 현인을 말한다. 즉 충암 김정. 청음 김상헌. 동계 정온. 규암 송인수. 우암 송시열을 지칭한다. 사실 서원은 사학(私學)을 대표하는 교육기관이면서 도 각 지방 군현의 향청(鄕廳)과 더불어 향촌사림의 집결소로서 정치.사회적 기능을 가지고 있었다. 귤림서원은 문묘종사였던 충암묘와 인재양성을 위해 설치되었던 장수당(藏修堂)에 그 연원을 두고 있다. 충암묘는 조광조 등과 함께 기묘사화에 연루되어 제주에 유배되었다가 사약을 받고 죽은 충암 김정의 넋을 기리기 위해 선조11년(1578)에 조인후 제주판관에 의해 그의 적거지에 세워졌다. 반면에 장수당은 효종 10년(1659)에 제주출신 진사 김짐용의 건의로 이회(李檜) 목사에 의해 책을 읽고 학문에 힘쓰는 장소로 지금의 오현단 일대에 건립되었다. 서로 위치를 달리했던 두 기관은 현종8년(1667) 최진남 제주판관이 김정의 사묘를 장수당 남쪽으로 옮기면서 합쳐지게 된 것이다. 즉. 이때부터 사(祀)와 재(齋)를 갖춘 서원으로 발전하게 되었다. 당시 이곳은 감귤을 진상하기 위해 과원이 있었던 곳으로 귤림서원은 귤나무가 무성한 곳에 서원이 위치해 있다는 의미에서 유래되었다. 귤림서원에 대한 국가의 공식적인 인정은 숙종8년(1682)에 이루어졌다.","address":"제주특별자치도 제주시 이도일동 1421-34","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3773"},{"id":3778,"name":"청수리 가마오름 일제 진지동굴","lat":33.30517,"lng":126.247815,"category":"확장분야","dir1":"역사","dir2":"일제강점기","title":"오늘에 남아있는 일제의 흔적들","subtitle":"","author":"제주도/제주예총","keywords":"일제시대.유적.흔적.교훈","content":"오늘에 남아있는 일제의 흔적들은 일제시대의 유적들을 사진으로 담아놓은 사진 집이다. 우리가 잘 알고 있는 진지동굴이라든지 모슬포에 즐비하게 있었던 격납고같은 설치물들. 고사포 기지. 그리고 주정공장의 모습이라 든지 당시의 적지 였거나 그랬을지도 모를 곳들이 사진으로 담겨져 있다 말 그대로 역사의 흔적인 것이다.","address":"제주특별자치도 제주시 한경면 청수리 1166","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3778"},{"id":3779,"name":"비자림","lat":33.49135,"lng":126.81058,"category":"확장분야","dir1":"사회","dir2":"사회","title":"제주도 2","subtitle":"","author":"제주도","keywords":"공무원.복지사회건설.향토개발","content":"기관공무원의 연구발표와 실무교양에 쓰여질 뿐아니라 향토개발사업의총계와 그리고 전도민의 경제 사회 문화들 각 분야의 연구 발표를 골고루 구제 하여 혁명정신무장을 강화하여 교양 향상에 이바지 하는데 그 목표가 있다. 우리는 언제나 민족의 독립과 국토의 통일을 염원해 왔다. 그러나 이는 어디까지나 목적을 위한 수단이지 목적 그 자체는 아닌 것이다. 우리의 목적은 민족의 영광 즉 복지사회건설에 있다. 독립된 지 십여년이 경과되도록 '유엔'에 가입하지 못함을 염려하기도 한다.","address":"제주특별자치도 제주시 구좌읍 평대리 3161-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3779"},{"id":3813,"name":"도두봉","lat":33.508034,"lng":126.468195,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"몰래물향토지","subtitle":"","author":"몰래물향토지발간위원회","keywords":"몰래물.도두봉.공항터","content":"몰래물은 한라 영산의 정기를 이어받은 도두봉과 드넓게 펼쳐진 비옥한 토지. 그리고 연안수자원이 풍부하여 다른 어느 지역보다도 무한히 도약할 수 있는 잠재력을 지닌 희망의 땅이었다. 그러나 불행히도 마을 전체가 제주국제공항 확장지역에 포함되어 모든 마을 주민들은 조상 대대로 살아온 고향을 지키고 싶었으나. 국가와 지역발전을 위한 충정으로 정든 고향을 떠나 여러 곳에 흩어져 정착하는 아픔을 겪었다. 비록 지금은 없는 마을이지만 그 역사를 기억하고자 본 지를 발간하여 몰래물의 역사. 자연환경을 기록하고. 1940년도 이전의 몰래물 원형도와 점차 변화과정의 지도를 함께 실고 있다.또한 몰래물의 신앙과 민속. 전설등도 살펴 볼 수 있다.","address":"제주특별자치도 제주시 도두일동 산1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3813"},{"id":3822,"name":"빌레못 동굴 유적","lat":33.404514,"lng":126.350424,"category":"확장분야","dir1":"문화","dir2":"전통문화","title":"제주도 천연동굴내 문화유적기초조사보고서","subtitle":"","author":"제주도","keywords":"천연동굴.동굴유적.동굴유산","content":"빌레못 동굴 유적'은 제주의 1만여년전의 연륙설을 뒷받침해주고 있는 매우 귀중한 문화 유산이다. 이처럼 제주의 천연동굴은 신비로운 자연일 뿐만 아니라. 역사의 보고로서 많은 문화유적이 아직도 동굴 속에 살아 있다는 것을 보여준다. 이에 따라 천연동굴의 문화유적에 대한 기초조사를 실시하고 보고서로 엮었다. 조사개요 및 조사에 대한 내용으로 동굴입구 집자리. 바위그늘 집자리에 대하여 적고 있다.","address":"제주특별자치도 제주시 애월읍 어음리 1391","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3822"},{"id":3842,"name":"용담레포츠 공원","lat":33.518207,"lng":126.499395,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"용담동지","subtitle":"","author":"용담동지편찬위원","keywords":"용담동.용두암.용연","content":"태초에 바다 한가운데에서 한라산이 솟아오르고. 백록담에서 두 줄기 큰 내(川)가 흘러넘쳐. 다시 바다와 만나 용연을 이루어 마을이 형성 된 곳.. 그래서 마을 이름을 용담이라 했고. 두줄기 큰 내 (한천. 병문천)를 중심으로 우리 용담동이 태동하기 시작했다. 이 향토지는 이러한 용담동의 고고사에서 현대사에 이르기까지 총 7장으로 구성되어 있다. 용담동의 역사와 문화. 유적. 설화등을 총망라한 본 지를 통해 선인들의 삶과 애환을 읽을 수 있을 것이다.","address":"제주특별자치도 제주시 용담삼동 1089","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3842"},{"id":3857,"name":"마이못 해안","lat":33.493345,"lng":126.427501,"category":"확장분야","dir1":"관광","dir2":"관광","title":"제주생태기행/제주시권","subtitle":"","author":"제주시/제주참여환경연대","keywords":"한라산.오름.습지.해안.하천.천연기념물.자연학습장","content":"우리 제주도는 예로부터 한라산 주변일대가 식물의 보고라고 할 만큼 다양한 식물자원을 가지고 있으며. 노루 등 야생동물들이 많이 서식하고 있는 천해의 자연을 그대로 간직한 고장입니다. 제주생태기행은 '식물 및 화산연구의 보고' 라고 할 수 있는 한라산의 자생식물 등을 비롯하여 '바람의 고향' 오류. '생태계의 요람' 습지. '제주 바다의 깊고 푸른빛' 제주해안. '제주 생명의 원류' 하천. '산신 같은 산천단 곰솔' 등 천연기념물과 자연학습장을 총망라한 자연 그대로의 세계를 담은 지침서로써 매우 소중한 자료라고 생각합니다.","address":"제주특별자치도 제주시 외도이동 1956-23","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3857"},{"id":3868,"name":"거믄여해안경승지","lat":33.243349,"lng":126.58115,"category":"확장분야","dir1":"문화","dir2":"생활문화","title":"그리운 서귀포칠십리여행","subtitle":"","author":"서귀포시","keywords":"서귀포.칠십리.테마여행","content":"이 책은 2002년 8월 23일 부터 11월 20일까지 전국민을 대상으로 공모한 자원 가운데 [서귀포칠십리 70경 자원선정 위원회]의 심의를 거쳐 지정한 서귀포 70경 관광화보집이다. 서귀포시에 오면 70가지의 독특한 아름다움과 만날 수 있다. 또한 다양한 레저체험과 휴양관광을 함께 즐기며 평생에 잊지 못할 소중한 추억거리를 만들 수 있다. 이러한 서귀포시의 70가지의 아름다움을 코스별로 4코스로 분류해 `칠십리 여행`으로 엮었다. 백록담과 돈내코. 서귀포 자연 휴양림. 영실기암. 예래동 환해장성. 서귀포 잠녀. 천제연 폭포. 칠선녀 축제. 법화사지. 강정천. 이중섭 문화의 거리. 자리테우. 서귀포 칠십리 축제. 정방폭포. 거믄여해안경승지. 쇠소깍. 서귀포 감귤. 향토 오일시장에 이르기까지 테마별 여행을 화보와 함께 소개 한다.","address":"제주특별자치도 서귀포시 토평동 473-1","url":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=&subClassification=&act=view&seq=3868"},{"id":4023,"name":"만수사터","lat":33.515655,"lng":126.532331,"category":"확장분야","dir1":"사회","dir2":"풍속/민속학","title":"건입동지","subtitle":"","author":"건입동마을회","keywords":"향토지.산천서당.산지천.제주항","content":"제주의 건입동은 많은 유적들이 널려있고 산지항 즉 제주항은 또한 중국과 무역의 관문이었습니다. 중요 유적으로는 산천서당. 연무장. 괘승정. 연교정. 영은정. 좌연각. 번길당. 홍예교 등이 있고 일제강점기에는 `산지용진회`라는 항일단체를 결사하여
